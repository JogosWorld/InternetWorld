<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IternetWorld</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--fundo);
    color:var(--texto);
}

:root{
    --fundo:#151515;
    --barra:#1e1e1e;
    --botao:#303030;
    --texto:#ffffff;
    --azul:#00bfff;
    --pagina:#ffffff;
    --textoPagina:#222222;
    --cartao:#f4f4f4;
}

body.claro{
    --fundo:#eeeeee;
    --barra:#ffffff;
    --botao:#dddddd;
    --texto:#111111;
    --pagina:#ffffff;
    --textoPagina:#222222;
    --cartao:#f4f4f4;
}

body.verde{
    --azul:#00d084;
}

body.roxo{
    --azul:#9b59ff;
}

body.vermelho{
    --azul:#ff3b30;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* ABAS */

.tabs{
    height:42px;
    display:flex;
    align-items:flex-end;
    background:#111;
    overflow-x:auto;
    padding-left:6px;
}

.tab{
    height:36px;
    min-width:150px;
    max-width:240px;
    background:#252525;
    color:#ccc;
    margin-right:3px;
    border-radius:9px 9px 0 0;
    display:flex;
    align-items:center;
    padding:0 10px;
    gap:8px;
    cursor:pointer;
}

.tab.active{
    background:var(--barra);
    color:var(--texto);
}

.tab-title{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.close-tab{
    border:0;
    background:transparent;
    color:inherit;
    font-size:18px;
    padding:0;
}

.new-tab{
    height:34px;
    min-width:38px;
    border:0;
    background:transparent;
    color:white;
    font-size:24px;
}

/* BARRA */

.toolbar{
    height:58px;
    background:var(--barra);
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    border-bottom:1px solid #333;
}

.logo{
    color:var(--azul);
    font-size:19px;
    font-weight:bold;
    white-space:nowrap;
    margin-right:5px;
}

.tool-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:8px;
    background:var(--botao);
    color:var(--texto);
    font-size:18px;
}

.tool-btn:hover{
    filter:brightness(1.2);
}

.address{
    flex:1;
    height:38px;
    border:1px solid #444;
    border-radius:20px;
    background:#111;
    color:white;
    padding:0 16px;
    outline:none;
}

body.claro .address{
    background:#f5f5f5;
    color:#111;
}

.go-btn{
    height:38px;
    border:0;
    border-radius:20px;
    background:var(--azul);
    color:white;
    padding:0 18px;
    font-weight:bold;
}

/* PÁGINAS */

#pages{
    flex:1;
    min-height:0;
    position:relative;
}

.page{
    width:100%;
    height:100%;
    overflow:auto;
    background:var(--pagina);
    color:var(--textoPagina);
}

.home{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
}

.home h1{
    font-size:54px;
    margin:0 0 10px;
    color:#111;
}

.home h1 span{
    color:#00aeea;
}

.home p{
    font-size:18px;
    margin:0 0 25px;
}

.home-search{
    width:min(700px,90%);
    display:flex;
    gap:8px;
}

.home-search input{
    flex:1;
    height:48px;
    border:1px solid #bbb;
    border-radius:25px;
    padding:0 20px;
    outline:none;
    font-size:16px;
}

.home-search button{
    height:48px;
    border:0;
    border-radius:25px;
    padding:0 25px;
    background:#00aeea;
    color:white;
    font-weight:bold;
}

.shortcuts{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.shortcut{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    background:#eee;
    color:#222;
}

.download{
    display:inline-block;
    margin-top:30px;
    padding:12px 20px;
    border-radius:10px;
    background:#222;
    color:white;
    text-decoration:none;
}

.version{
    margin-top:12px;
    color:#777;
    font-size:13px;
}

/* RESULTADOS */

.results{
    padding:30px;
    max-width:1000px;
    margin:auto;
}

.results h2{
    color:#222;
}

.result{
    padding:18px;
    margin:12px 0;
    border-radius:10px;
    background:#f5f5f5;
    border:1px solid #ddd;
    cursor:pointer;
}

.result:hover{
    background:#eaeaea;
}

.result-title{
    color:#1769aa;
    font-size:19px;
    font-weight:bold;
}

.result-url{
    color:#198754;
    font-size:13px;
    margin:5px 0;
}

.result-desc{
    color:#444;
}

/* WEBVIEW */

.webview-container{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.webview-header{
    height:38px;
    background:#eee;
    color:#222;
    display:flex;
    align-items:center;
    padding:0 12px;
    font-size:13px;
    border-bottom:1px solid #ccc;
}

.webview-container iframe{
    width:100%;
    flex:1;
    border:0;
}

/* PERSONALIZAÇÃO */

.customization{
    position:absolute;
    right:10px;
    top:100px;
    z-index:100;
    background:var(--barra);
    border:1px solid #555;
    border-radius:12px;
    padding:12px;
    display:none;
    box-shadow:0 10px 30px #0008;
}

.customization.show{
    display:block;
}

.customization button{
    display:block;
    width:150px;
    border:0;
    border-radius:8px;
    padding:10px;
    margin:5px;
    background:var(--botao);
    color:var(--texto);
}

/* LOGIN */

#loginModal{
    position:fixed;
    inset:0;
    background:#0009;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

#loginModal.show{
    display:flex;
}

.login-box{
    width:min(400px,90%);
    background:white;
    color:#222;
    border-radius:18px;
    padding:28px;
    box-shadow:0 20px 60px #0008;
}

.login-box h2{
    margin-top:0;
    text-align:center;
}

.login-box input{
    width:100%;
    height:45px;
    margin:7px 0;
    padding:0 13px;
    border:1px solid #ccc;
    border-radius:8px;
}

.login-main{
    width:100%;
    height:45px;
    border:0;
    border-radius:8px;
    background:#00aeea;
    color:white;
    font-weight:bold;
    margin-top:8px;
}

.login-secondary{
    width:100%;
    border:0;
    background:transparent;
    color:#008dcc;
    padding:12px;
}

.login-close{
    width:100%;
    border:0;
    background:#eee;
    padding:10px;
    border-radius:8px;
}

.login-message{
    min-height:20px;
    text-align:center;
    color:#d00;
    font-size:14px;
}

.user-button{
    min-width:38px;
    height:38px;
    border:0;
    border-radius:20px;
    background:var(--azul);
    color:white;
    font-size:17px;
    padding:0 12px;
}

/* PERFIL */

.profile-box{
    text-align:center;
}

.profile-box strong{
    display:block;
    font-size:20px;
    margin:10px;
}

.logout{
    border:0;
    border-radius:8px;
    background:#e53935;
    color:white;
    padding:10px 20px;
}

/* MOBILE */

@media(max-width:700px){
    .logo{
        display:none;
    }

    .toolbar{
        gap:5px;
    }

    .tool-btn{
        width:34px;
    }

    .home h1{
        font-size:40px;
    }

    .address{
        min-width:80px;
    }

    .go-btn{
        padding:0 12px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="tabs" id="tabs"></div>

    <div class="toolbar">

        <div class="logo">🌐 IternetWorld</div>

        <button class="tool-btn" onclick="goBack()" title="Voltar">←</button>
        <button class="tool-btn" onclick="goForward()" title="Avançar">→</button>
        <button class="tool-btn" onclick="goHome()" title="Início">⌂</button>
        <button class="tool-btn" onclick="reloadPage()" title="Recarregar">↻</button>

        <input
            id="address"
            class="address"
            placeholder="Pesquisar ou escrever um endereço"
            onkeydown="if(event.key==='Enter') goAddress()"
        >

        <button class="go-btn" onclick="goAddress()">Ir</button>

        <button class="tool-btn" onclick="toggleCustomization()" title="Personalizar">
            🎨
        </button>

        <button class="user-button" onclick="openLogin()" id="userButton">
            👤
        </button>

    </div>

    <div id="pages"></div>

    <div class="customization" id="customization">

        <button onclick="setTheme('')">🌙 Escuro</button>
        <button onclick="setTheme('claro')">☀️ Claro</button>
        <button onclick="setTheme('')">🔵 Azul</button>
        <button onclick="setTheme('verde')">🟢 Verde</button>
        <button onclick="setTheme('roxo')">🟣 Roxo</button>
        <button onclick="setTheme('vermelho')">🔴 Vermelho</button>

    </div>

</div>


<!-- LOGIN OPCIONAL -->

<div id="loginModal">

    <div class="login-box">

        <h2 id="loginTitle">👤 Iniciar sessão</h2>

        <div id="loginForm">

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Palavra-passe"
            >

            <div class="login-message" id="loginMessage"></div>

            <button class="login-main" onclick="loginUser()">
                Iniciar sessão
            </button>

            <button class="login-secondary" onclick="toggleRegister()">
                Criar uma conta
            </button>

            <button class="login-close" onclick="closeLogin()">
                Fechar
            </button>

        </div>

    </div>

</div>


<script>

let tabs = [];
let activeTab = null;
let tabCounter = 0;


/* =========================
   ABAS
========================= */

function createTab(title="Nova aba"){

    const id = ++tabCounter;

    tabs.push({
        id:id,
        title:title,
        url:"",
        history:[],
        historyIndex:-1
    });

    activeTab=id;

    renderTabs();
    renderPages();

    goHome();
}


function getActiveTab(){

    return tabs.find(t => t.id === activeTab);
}


function renderTabs(){

    const container=document.getElementById("tabs");

    container.innerHTML="";

    tabs.forEach(tab=>{

        const div=document.createElement("div");

        div.className="tab"+(tab.id===activeTab?" active":"");

        div.onclick=()=>activateTab(tab.id);

        div.innerHTML=`
            <span class="tab-title">${escapeHtml(tab.title)}</span>
            <button class="close-tab" onclick="event.stopPropagation();closeTab(${tab.id})">×</button>
        `;

        container.appendChild(div);

    });

    const newTab=document.createElement("button");

    newTab.className="new-tab";
    newTab.textContent="+";
    newTab.onclick=()=>createTab();

    container.appendChild(newTab);
}


function renderPages(){

    const pages=document.getElementById("pages");

    pages.innerHTML="";

    const tab=getActiveTab();

    if(!tab)return;

    const page=document.createElement("div");

    page.className="page";
    page.id="page-"+tab.id;

    pages.appendChild(page);
}


function activateTab(id){

    activeTab=id;

    renderTabs();
    renderPages();

    const tab=getActiveTab();

    if(!tab)return;

    if(tab.url){

        if(tab.url.startsWith("search:")){

            showDuckResults(tab.url.substring(7),false);

        }else{

            showWebview(tab.url,false);

        }

    }else{

        goHome();

    }
}


function closeTab(id){

    const index=tabs.findIndex(t=>t.id===id);

    if(index===-1)return;

    tabs.splice(index,1);

    if(tabs.length===0){

        createTab();

        return;
    }

    if(activeTab===id){

        activeTab=tabs[Math.max(0,index-1)].id;

    }

    renderTabs();
    renderPages();

    const tab=getActiveTab();

    if(tab.url){

        if(tab.url.startsWith("search:"))
            showDuckResults(tab.url.substring(7),false);
        else
            showWebview(tab.url,false);

    }else{

        goHome();

    }
}


/* =========================
   PÁGINA INICIAL
========================= */

function createHomeHTML(){

    return `

    <div class="home">

        <h1>🌐 <span>IternetWorld</span></h1>

        <p>Pesquise na Internet com o DuckDuckGo</p>

        <div class="home-search">

            <input
                id="homeSearch"
                placeholder="Pesquisar na Internet..."
                onkeydown="if(event.key==='Enter') searchFromHome()"
            >

            <button onclick="searchFromHome()">
                Pesquisar
            </button>

        </div>

        <div class="shortcuts">

            <button class="shortcut" onclick="openShortcut('https://www.youtube.com/')">
                ▶️ YouTube
            </button>

            <button class="shortcut" onclick="openShortcut('https://www.google.com/')">
                🔎 Google
            </button>

            <button class="shortcut" onclick="openShortcut('https://www.minecraft.net/')">
                ⛏️ Minecraft
            </button>

            <button class="shortcut" onclick="searchText('notícias')">
                📰 Notícias
            </button>

        </div>

        <a
            class="download"
            href="https://github.com/JogosWorld/InternetWorld/releases/download/v1.0.0/IternetWorld.Setup.1.0.0.exe"
            target="_blank"
        >
            ⬇️ Download IternetWorld para Windows
        </a>

        <div class="version">
            Versão 1.0.0 · Windows
        </div>

    </div>

    `;
}


function goHome(){

    const tab=getActiveTab();

    if(!tab)return;

    tab.url="";
    tab.title="Nova aba";

    renderTabs();
    renderPages();

    const page=document.getElementById("page-"+tab.id);

    if(page){

        page.innerHTML=createHomeHTML();

    }

    updateAddress("");

}


/* =========================
   PESQUISA
========================= */

function searchFromHome(){

    const input=document.getElementById("homeSearch");

    if(!input)return;

    searchText(input.value);

}


function searchText(text){

    text=text.trim();

    if(!text)return;

    const tab=getActiveTab();

    tab.url="search:"+text;
    tab.title=text;

    tab.history=tab.history.slice(0,tab.historyIndex+1);

    tab.history.push("search:"+text);
    tab.historyIndex=tab.history.length-1;

    renderTabs();
    renderPages();

    showDuckResults(text,false);

}


function showDuckResults(query,record=true){

    const page=document.getElementById("page-"+activeTab);

    if(!page)return;

    updateAddress(query);

    const encoded=encodeURIComponent(query);

    page.innerHTML=`

    <div class="results">

        <h2>🔎 Resultados para: ${escapeHtml(query)}</h2>

        <div class="result" onclick="openResult('https://www.youtube.com/')">
            <div class="result-title">YouTube</div>
            <div class="result-url">youtube.com</div>
            <div class="result-desc">Vídeos, música e entretenimento.</div>
        </div>

        <div class="result" onclick="openResult('https://www.google.com/search?q=${encoded}')">
            <div class="result-title">Google</div>
            <div class="result-url">google.com</div>
            <div class="result-desc">Pesquisar na Internet.</div>
        </div>

        <div class="result" onclick="openResult('https://pt.wikipedia.org/wiki/${encoded}')">
            <div class="result-title">Wikipedia</div>
            <div class="result-url">pt.wikipedia.org</div>
            <div class="result-desc">Enciclopédia livre.</div>
        </div>

        <div class="result" onclick="openResult('https://github.com/search?q=${encoded}')">
            <div class="result-title">GitHub</div>
            <div class="result-url">github.com</div>
            <div class="result-desc">Projetos e código.</div>
        </div>

        <div style="margin-top:25px;text-align:center">
            <button
                class="go-btn"
                onclick="openResult('https://duckduckgo.com/?q=${encoded}')"
            >
                Abrir mais resultados
            </button>
        </div>

    </div>

    `;

}


function openResult(url){

    openShortcut(url);

}


/* =========================
   SITES
========================= */

function openShortcut(url){

    const tab=getActiveTab();

    if(!tab)return;

    tab.url=url;
    tab.title=getTitleFromUrl(url);

    tab.history=tab.history.slice(0,tab.historyIndex+1);
    tab.history.push(url);
    tab.historyIndex=tab.history.length-1;

    renderTabs();
    renderPages();

    showWebview(url,false);

}


function showWebview(url,record=true){

    const page=document.getElementById("page-"+activeTab);

    if(!page)return;

    updateAddress(url);

    const host=getTitleFromUrl(url);

    page.innerHTML=`

    <div class="webview-container">

        <div class="webview-header">
            🌐 ${escapeHtml(host)}
        </div>

        <iframe
            src="${escapeAttribute(url)}"
            allowfullscreen
            allow="autoplay; encrypted-media; picture-in-picture"
        ></iframe>

    </div>

    `;

}


/* =========================
   BARRA DE ENDEREÇO
========================= */

function goAddress(){

    const input=document.getElementById("address");

    let value=input.value.trim();

    if(!value)return;

    if(/^https?:\/\//i.test(value)){

        loadUrl(value);

        return;

    }

    if(/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(value)){

        loadUrl("https://"+value);

        return;

    }

    searchText(value);

}


function loadUrl(url){

    const tab=getActiveTab();

    if(!tab)return;

    tab.url=url;
    tab.title=getTitleFromUrl(url);

    tab.history=tab.history.slice(0,tab.historyIndex+1);
    tab.history.push(url);
    tab.historyIndex=tab.history.length-1;

    renderTabs();
    renderPages();

    showWebview(url,false);

}


function updateAddress(value){

    const input=document.getElementById("address");

    if(input)
        input.value=value;

}


/* =========================
   NAVEGAÇÃO
========================= */

function goBack(){

    const tab=getActiveTab();

    if(!tab)return;

    if(tab.historyIndex<=0)return;

    tab.historyIndex--;

    const url=tab.history[tab.historyIndex];

    tab.url=url;

    if(url.startsWith("search:")){

        showDuckResults(url.substring(7),false);

    }else{

        showWebview(url,false);

    }

}


function goForward(){

    const tab=getActiveTab();

    if(!tab)return;

    if(tab.historyIndex>=tab.history.length-1)return;

    tab.historyIndex++;

    const url=tab.history[tab.historyIndex];

    tab.url=url;

    if(url.startsWith("search:")){

        showDuckResults(url.substring(7),false);

    }else{

        showWebview(url,false);

    }

}


function reloadPage(){

    const tab=getActiveTab();

    if(!tab)return;

    if(tab.url){

        if(tab.url.startsWith("search:"))
            showDuckResults(tab.url.substring(7),false);
        else
            showWebview(tab.url,false);

    }else{

        goHome();

    }

}


/* =========================
   TEMAS
========================= */

function toggleCustomization(){

    document
        .getElementById("customization")
        .classList.toggle("show");

}


function setTheme(theme){

    document.body.className=theme;

    localStorage.setItem("IternetWorldTheme",theme);

    document
        .getElementById("customization")
        .classList.remove("show");

}


const savedTheme=localStorage.getItem("IternetWorldTheme");

if(savedTheme!==null){

    document.body.className=savedTheme;

}


/* =========================
   LOGIN OPCIONAL
========================= */

let registerMode=false;


function openLogin(){

    const current=localStorage.getItem("IternetWorldCurrentUser");

    if(current){

        showProfile();

    }else{

        registerMode=false;

        document.getElementById("loginTitle").textContent="👤 Iniciar sessão";
        document.querySelector(".login-main").textContent="Iniciar sessão";
        document.querySelector(".login-secondary").textContent="Criar uma conta";

        document.getElementById("loginMessage").textContent="";

        document.getElementById("loginModal").classList.add("show");

    }

}


function closeLogin(){

    document
        .getElementById("loginModal")
        .classList.remove("show");

}


function toggleRegister(){

    registerMode=!registerMode;

    document.getElementById("loginTitle").textContent=
        registerMode ? "📝 Criar conta" : "👤 Iniciar sessão";

    document.querySelector(".login-main").textContent=
        registerMode ? "Criar conta" : "Iniciar sessão";

    document.querySelector(".login-secondary").textContent=
        registerMode ? "Já tenho uma conta" : "Criar uma conta";

    document.getElementById("loginMessage").textContent="";

}


function getUsers(){

    try{

        return JSON.parse(
            localStorage.getItem("IternetWorldUsers") || "[]"
        );

    }catch(e){

        return [];

    }

}


function saveUsers(users){

    localStorage.setItem(
        "IternetWorldUsers",
        JSON.stringify(users)
    );

}


function loginUser(){

    const email=document.getElementById("loginEmail").value.trim();
    const password=document.getElementById("loginPassword").value;

    const message=document.getElementById("loginMessage");

    if(!email || !password){

        message.textContent="Preenche o email e a palavra-passe.";

        return;

    }

    const users=getUsers();

    if(registerMode){

        if(users.some(u=>u.email===email)){

            message.textContent="Esta conta já existe.";

            return;

        }

        users.push({
            email:email,
            password:password
        });

        saveUsers(users);

        localStorage.setItem(
            "IternetWorldCurrentUser",
            email
        );

        closeLogin();

        updateUserButton();

        return;

    }

    const user=users.find(
        u=>u.email===email && u.password===password
    );

    if(!user){

        message.textContent="Email ou palavra-passe incorretos.";

        return;

    }

    localStorage.setItem(
        "IternetWorldCurrentUser",
        email
    );

    closeLogin();

    updateUserButton();

}


function showProfile(){

    const email=localStorage.getItem(
        "IternetWorldCurrentUser"
    );

    if(!email)return;

    const modal=document.getElementById("loginModal");

    modal.classList.add("show");

    document.getElementById("loginTitle").textContent="👤 A tua conta";

    document.getElementById("loginForm").innerHTML=`

        <div class="profile-box">

            <div>Início de sessão ativo</div>

            <strong>${escapeHtml(email)}</strong>

            <button class="logout" onclick="logoutUser()">
                Terminar sessão
            </button>

            <br><br>

            <button class="login-close" onclick="closeLogin()">
                Fechar
            </button>

        </div>

    `;

}


function logoutUser(){

    localStorage.removeItem(
        "IternetWorldCurrentUser"
    );

    location.reload();

}


function updateUserButton(){

    const button=document.getElementById("userButton");

    const current=localStorage.getItem(
        "IternetWorldCurrentUser"
    );

    if(current){

        button.textContent="👤";
        button.title=current;

    }else{

        button.textContent="👤";
        button.title="Iniciar sessão";

    }

}


/* =========================
   SEGURANÇA
========================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


function getTitleFromUrl(url){

    try{

        const host=new URL(url).hostname
            .replace(/^www\./,"");

        return host || "Nova aba";

    }catch(e){

        return "Nova aba";

    }

}


/* =========================
   CLIQUES E TECLADO
========================= */

document.addEventListener("click",function(event){

    const menu=document.getElementById("customization");

    const button=event.target.closest(".tool-btn");

    if(
        menu &&
        !menu.contains(event.target) &&
        !button
    ){

        menu.classList.remove("show");

    }

});


document.addEventListener("keydown",function(event){

    if(
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase()==="l"
    ){

        event.preventDefault();

        const address=document.getElementById("address");

        address.focus();
        address.select();

    }

});


/* =========================
   INICIAR INTERNETWORLD
========================= */

updateUserButton();

createTab("Nova aba");

</script>
