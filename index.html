}

.tabs{
    height:100%;
    display:flex;
    align-items:center;
    gap:6px;
    flex:1;
    overflow:auto;
}

.tab{
    height:40px;
    min-width:150px;
    max-width:230px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 10px 0 13px;
    border-radius:12px;
    color:var(--muted);
    background:transparent;
    cursor:pointer;
    transition:.2s;
}

.tab:hover{
    background:var(--card2);

.tab.active{

}

.tabTitle{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
}

.closeTab{
    border:0;
    background:none;
    color:var(--muted);
    cursor:pointer;
    font-size:17px;
}

.newTab{
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    background:transparent;
    color:var(--text);
    font-size:23px;
    cursor:pointer;
}

.newTab:hover{
    background:var(--card2);
}

}

.address span{

}

.address input{

}

.login:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:white;
}
