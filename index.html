<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boser</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10151f;
  color: white;
  height: 100vh;
  overflow: hidden;
}

header {
  background: #171e2b;
  border-bottom: 1px solid #30394a;
}

.tabs {
  height: 42px;
  display: flex;
  align-items: end;
  padding: 5px 8px 0;
  gap: 5px;
  overflow-x: auto;
}

.tab {
  background: #242d3d;
  color: #b8c1d1;
  min-width: 150px;
  max-width: 230px;
  height: 37px;
  border-radius: 9px 9px 0 0;
  display: flex;
  align-items: center;
  padding: 0 10px;
  cursor: pointer;
}

.tab.active {
  background: #303c50;
  color: white;
}

.tab-name {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  flex: 1;
}

.tab-close {
  border: 0;
  background: transparent;
  color: #aaa;
  font-size: 17px;
  cursor: pointer;
}

.new-tab {
  border: 0;
  background: transparent;
  color: white;
  font-size: 25px;
  cursor: pointer;
  padding: 5px 12px;
}

.toolbar {
  height: 65px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
}

.tool {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 9px;
  background: #242d3d;
  color: white;
  font-size: 19px;
  cursor: pointer;
}

.tool:hover {
  background: #354258;
}

.address {
  height: 42px;
  border-radius: 23px;
  background: #f4f6f8;
  display: flex;
  align-items: center;
  padding: 0 6px 0 15px;
  flex: 1;
}

.address input {
  border: 0;
  outline: none;
  background: transparent;
  color: #172033;
  font-size: 15px;
  flex: 1;
}

.address button {
  border: 0;
  border-radius: 19px;
  background: #2563eb;
  color: white;
  padding: 9px 16px;
  cursor: pointer;
}

.page {
  height: calc(100vh - 107px);
  overflow: auto;
}

.home {
  min-height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.home-content {
  width: min(700px, 90%);
}

.logo {
  font-size: 70px;
  font-weight: bold;
  letter-spacing: -5px;
  margin-bottom: 10px;
}

.subtitle {
  color: #9ba7b8;
  font-size: 18px;
}

.search {
  margin: 30px auto;
  display: flex;
  background: white;
  border-radius: 30px;
  padding: 6px;
  max-width: 650px;
}

.search input {
  flex: 1;
  border: 0;
  outline: none;
  padding: 13px 18px;
  font-size: 16px;
}

.search button {
  border: 0;
  background: #2563eb;
  color: white;
  border-radius: 24px;
  padding: 0 22px;
  cursor: pointer;
}

.shortcuts {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.shortcut {
  background: #202938;
  border: 1px solid #354052;
  color: white;
  padding: 12px 18px;
  border-radius: 20px;
  cursor: pointer;
}

.panel {
  position: absolute;
  z-index: 20;
  right: 12px;
  top: 105px;
  width: 210px;
  background: #202938;
  border: 1px solid #3b4659;
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 15px 40px #0008;
}

.panel button {
  width: 100%;
  padding: 12px;
  border: 0;
  background: transparent;
  color: white;
  text-align: left;
  border-radius: 8px;
  cursor: pointer;
}

.panel button:hover {
  background: #344158;
}

.hidden {
  display: none;
}

.modal {
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 50;
  display: flex;
  justify-content: center;
  align-items: center;
}

.modal-box {
  width: min(700px, 90%);
  max-height: 80vh;
  overflow: auto;
  background: #182130;
  border: 1px solid #3c485c;
  border-radius: 15px;
  padding: 20px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header button {
  background: transparent;
  border: 0;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #303b4d;
}

.item a {
  color: #7db2ff;
  flex: 1;
  text-decoration: none;
}

.item button {
  background: #334155;
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 7px 10px;
  cursor: pointer;
}

.light {
  background: #f1f5f9;
  color: #172033;
}

.light header {
  background: #dce3eb;
}

.light .tab {
  background: #cbd5e1;
  color: #334155;
}

.light .tab.active {
  background: white;
  color: #172033;
}

.light .tool {
  background: white;
  color: #172033;
}

.light .panel {
  background: white;
}

.light .panel button {
  color: #172033;
}

.light .shortcut {
  background: white;
  color: #172033;
}

.light .modal-box {
  background: white;
  color: #172033;
}

.light .modal-header button {
  color: #172033;
}
</style>
</head>

<body>

<header>

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">

    <button class="tool" onclick="goBack()">←</button>

    <button class="tool" onclick="goForward()">→</button>

    <button class="tool" onclick="reloadPage()">↻</button>

    <button class="tool" onclick="goHome()">⌂</button>

    <form class="address" onsubmit="navigate(event)">

      <span>🔒</span>

      <input
        id="address"
        placeholder="Pesquisar ou digitar endereço"
      >

      <button>Ir</button>

    </form>

    <button
      class="tool"
      onclick="addFavorite()"
      title="Favorito"
    >
      ☆
    </button>

    <button
      class="tool"
      onclick="toggleMenu()"
    >
      ☰
    </button>

  </div>

</header>

<div
  id="menu"
  class="panel hidden"
>

  <button onclick="showFavorites()">
    ⭐ Favoritos
  </button>

  <button onclick="showHistory()">
    🕘 Histórico
  </button>

  <button onclick="toggleDarkMode()">
    🌙 Modo escuro
  </button>

</div>

<main class="page" id="page">

  <section class="home">

    <div class="home-content">

      <div class="logo">
        Boser
      </div>

      <div class="subtitle">
        Um navegador simples, rápido e moderno.
      </div>

      <form
        class="search"
        onsubmit="homeSearch(event)"
      >

        <input
          id="homeSearch"
          placeholder="Pesquisar na internet..."
        >

        <button>
          Pesquisar
        </button>

      </form>

      <div class="shortcuts">

        <button
          class="shortcut"
          onclick="openSite('https://www.google.com')"
        >
          Google
        </button>

        <button
          class="shortcut"
          onclick="openSite('https://www.youtube.com')"
        >
          YouTube
        </button>

        <button
          class="shortcut"
          onclick="openSite('https://www.wikipedia.org')"
        >
          Wikipedia
        </button>

      </div>

    </div>

  </section>

</main>

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="modalTitle">
        Boser
      </h2>

      <button onclick="closeModal()">
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>

<script>

let tabs = [];
let activeTab = 0;

let historyList =
  JSON.parse(
    localStorage.getItem("boserHistory") || "[]"
  );

let favorites =
  JSON.parse(
    localStorage.getItem("boserFavorites") || "[]"
  );

function saveData() {

  localStorage.setItem(
    "boserHistory",
    JSON.stringify(historyList)
  );

  localStorage.setItem(
    "boserFavorites",
    JSON.stringify(favorites)
  );
}

function createTab(url = "") {

  const tab = {
    id: Date.now() + Math.random(),
    title: "Nova aba",
    url: url
  };

  tabs.push(tab);

  activeTab = tabs.length - 1;

  renderTabs();

  if (url) {
    navigateTo(url);
  } else {
    showHome();
  }
}

function renderTabs() {

  const container =
    document.getElementById("tabs");

  container.innerHTML = "";

  tabs.forEach((tab, index) => {

    const element =
      document.createElement("div");

    element.className =
      "tab " +
      (index === activeTab
        ? "active"
        : "");

    element.innerHTML = `

      <span class="tab-name">
        ${escapeHtml(tab.title)}
      </span>

      <button
        class="tab-close"
        onclick="closeTab(event, ${index})"
      >
        ×
      </button>

    `;

    element.onclick = () => {

      activeTab = index;

      renderTabs();

      if (tab.url) {
        navigateTo(tab.url, false);
      } else {
        showHome();
      }

    };

    container.appendChild(element);

  });

  const button =
    document.createElement("button");

  button.className = "new-tab";

  button.textContent = "+";

  button.onclick = () =>
    createTab();

  container.appendChild(button);
}

function closeTab(event, index) {

  event.stopPropagation();

  tabs.splice(index, 1);

  if (!tabs.length) {
    createTab();
    return;
  }

  if (activeTab >= tabs.length) {
    activeTab = tabs.length - 1;
  }

  renderTabs();

  const tab = tabs[activeTab];

  if (tab.url) {
    navigateTo(tab.url, false);
  } else {
    showHome();
  }
}

function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showHome() {

  document.getElementById("address").value = "";

  document.getElementById("page").innerHTML = `

    <section class="home">

      <div class="home-content">

        <div class="logo">
          Boser
        </div>

        <div class="subtitle">
          Um navegador simples, rápido e moderno.
        </div>

        <form
          class="search"
          onsubmit="homeSearch(event)"
        >

          <input
            id="homeSearch"
            placeholder="Pesquisar na internet..."
          >

          <button>
            Pesquisar
          </button>

        </form>

        <div class="shortcuts">

          <button
            class="shortcut"
            onclick="openSite('https://www.google.com')"
          >
            Google
          </button>

          <button
            class="shortcut"
            onclick="openSite('https://www.youtube.com')"
          >
            YouTube
          </button>

          <button
            class="shortcut"
            onclick="openSite('https://www.wikipedia.org')"
          >
            Wikipedia
          </button>

        </div>

      </div>

    </section>
  `;
}

function homeSearch(event) {

  event.preventDefault();

  const value =
    document.getElementById(
      "homeSearch"
    ).value.trim();

  if (value) {
    navigateTo(
      makeUrl(value)
    );
  }
}

function navigate(event) {

  event.preventDefault();

  const value =
    document.getElementById(
      "address"
    ).value.trim();

  if (value) {
    navigateTo(
      makeUrl(value)
    );
  }
}

function makeUrl(value) {

  if (/^https?:\\/\\//i.test(value)) {
    return value;
  }

  if (
    /^[\\w.-]+\\.[a-z]{2,}/i.test(value)
  ) {
    return "https://" + value;
  }

  return (
    "https://www.google.com/search?q=" +
    encodeURIComponent(value)
  );
}

function navigateTo(url, addHistory = true) {

  const tab = tabs[activeTab];

  if (!tab) return;

  tab.url = url;

  tab.title = url
    .replace(/^https?:\\/\\//i, "")
    .split("/")[0];

  document.getElementById(
    "address"
  ).value = url;

  renderTabs();

  if (addHistory) {

    historyList.unshift({
      title: tab.title,
      url: url,
      time: Date.now()
    });

    historyList =
      historyList.slice(0, 200);

    saveData();
  }

  /*
    IMPORTANTE:

    Um arquivo HTML normal não consegue
    substituir completamente um navegador
    como Chrome.

    Esta versão abre o endereço em uma
    nova aba do navegador do sistema.
  */

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}

function openSite(url) {
  navigateTo(url);
}

function goHome() {
  tabs[activeTab].url = "";
  tabs[activeTab].title = "Nova aba";

  renderTabs();

  showHome();
}

function reloadPage() {

  const tab = tabs[activeTab];

  if (tab && tab.url) {
    window.open(
      tab.url,
      "_blank",
      "noopener,noreferrer"
    );
  }
}

function goBack() {
  history.back();
}

function goForward() {
  history.forward();
}

function addFavorite() {

  const tab = tabs[activeTab];

  if (!tab || !tab.url) {

    alert(
      "Abra um site primeiro para adicionar aos favoritos."
    );

    return;
  }

  if (
    !favorites.some(
      item => item.url === tab.url
    )
  ) {

    favorites.push({
      title: tab.title,
      url: tab.url
    });

    saveData();

    alert("⭐ Adicionado aos favoritos!");

  } else {

    alert(
      "Esse site já está nos favoritos."
    );
  }
}

function showFavorites() {

  const html =
    favorites.length
      ? favorites.map((item, index) => `

        <div class="item">

          <a
            href="#"
            onclick="openFavorite(${index})"
          >
            ${escapeHtml(item.title)}
          </a>

          <button
            onclick="removeFavorite(${index})"
          >
            ×
          </button>

        </div>

      `).join("")
      : "<p>Nenhum favorito.</p>";

  openModal(
    "⭐ Favoritos",
    html
  );
}

function openFavorite(index) {

  const item = favorites[index];

  closeModal();

  navigateTo(item.url);
}

function removeFavorite(index) {

  favorites.splice(index, 1);

  saveData();

  showFavorites();
}

function showHistory() {

  const html =
    historyList.length
      ? `

        <button
          onclick="clearHistory()"
          style="
            padding:10px;
            margin-bottom:10px;
            cursor:pointer;
          "
        >
          Limpar histórico
        </button>

        ${
          historyList.map((item, index) => `

            <div class="item">

              <a
                href="#"
                onclick="openHistory(${index})"
              >
                ${escapeHtml(item.title)}
              </a>

              <small>
                ${new Date(
                  item.time
                ).toLocaleString()}
              </small>

            </div>

          `).join("")
        }

      `
      : "<p>Nenhum histórico.</p>";

  openModal(
    "🕘 Histórico",
    html
  );
}

function openHistory(index) {

  const item =
    historyList[index];

  closeModal();

  navigateTo(item.url);
}

function clearHistory() {

  historyList = [];

  saveData();

  showHistory();
}

function openModal(title, content) {

  document.getElementById(
    "modalTitle"
  ).textContent = title;

  document.getElementById(
    "modalContent"
  ).innerHTML = content;

  document.getElementById(
    "modal"
  ).classList.remove("hidden");
}

function closeModal() {

  document.getElementById(
    "modal"
  ).classList.add("hidden");
}

function toggleMenu() {

  document.getElementById(
    "menu"
  ).classList.toggle("hidden");
}

function toggleDarkMode() {

  document.body.classList.toggle(
    "light"
  );

  localStorage.setItem(
    "boserTheme",
    document.body.classList.contains(
      "light"
    )
      ? "light"
      : "dark"
  );

  document.getElementById(
    "menu"
  ).classList.add("hidden");
}

if (
  localStorage.getItem(
    "boserTheme"
  ) === "light"
) {
  document.body.classList.add(
    "light"
  );
}

createTab();

</script>

</body>
</html>
