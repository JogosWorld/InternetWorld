
<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>IternetWorld</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#0b1120;
  --bar:#111a2b;
  --card:#182338;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:#2c3a52;
  --accent:#2563eb;
}

body.light{
  --bg:#eef2f7;
  --bar:#ffffff;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --line:#cbd5e1;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TABS */

#tabs{
  height:46px;
  background:var(--bar);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 7px;
  overflow-x:auto;
}

.tab{
  height:36px;
  min-width:145px;
  max-width:220px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 8px 0 12px;
  border-radius:9px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
}

.tab:hover{
  background:var(--card);
  color:var(--text);
}

.tab.active{
  background:var(--card);
  color:var(--text);
  border-color:var(--line);
}

.tabTitle{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:left;
}

.tabClose{
  width:25px;
  height:25px;
  border:0;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
}

.tabClose:hover{
  background:rgba(127,127,127,.2);
  color:var(--text);
}

.newTab{
  width:36px;
  height:36px;
  flex:none;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
  color:var(--text);
  font-size:20px;
}

/* BARRA */

#toolbar{
  height:58px;
  flex:none;
  background:var(--bar);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 10px;
}

.logo{
  font-size:17px;
  font-weight:bold;
  margin:0 6px 0 4px;
  white-space:nowrap;
}

.logo b{
  color:var(--accent);
}

.tool{
  width:36px;
  height:36px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
  color:var(--text);
}

.tool:hover{
  border-color:var(--accent);
}

#addressForm{
  flex:1;
  min-width:100px;
  display:flex;
  gap:6px;
}

#address{
  width:100%;
  height:36px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  outline:none;
  padding:0 13px;
}

#address:focus{
  border-color:var(--accent);
}

.go{
  height:36px;
  border:0;
  border-radius:9px;
  padding:0 15px;
  background:var(--accent);
  color:white;
  font-weight:bold;
}

#loginButton{
  height:36px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
  color:var(--text);
  padding:0 12px;
  white-space:nowrap;
}

/* PÁGINA */

#page{
  flex:1;
  overflow:auto;
  background:var(--bg);
}

/* HOME */

.home{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 15px;
}

.homeLogo{
  font-size:64px;
  font-weight:900;
  letter-spacing:-3px;
  margin-bottom:5px;
}

.homeLogo b{
  color:var(--accent);
}

.homeText{
  color:var(--muted);
  margin-bottom:25px;
}

.homeSearch{
  width:min(700px,95%);
  display:flex;
  gap:7px;
}

.homeSearch input{
  flex:1;
  height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  padding:0 15px;
  outline:none;
}

.homeSearch input:focus{
  border-color:var(--accent);
}

.homeSearch button{
  height:48px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:white;
  padding:0 22px;
  font-weight:bold;
}

.quick{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  max-width:750px;
  margin-top:20px;
}

.quick button,
.quick a{
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  padding:10px 14px;
  text-decoration:none;
}

.quick button:hover,
.quick a:hover{
  border-color:var(--accent);
}

.homeInfo{
  margin-top:20px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

/* SITE */

.site{
  height:100%;
  display:flex;
  flex-direction:column;
}

.siteHeader{
  height:40px;
  flex:none;
  background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 12px;
  color:var(--muted);
  font-size:13px;
}

.siteHeader strong{
  color:var(--text);
  margin-right:8px;
}

.frame{
  width:100%;
  flex:1;
  border:0;
  background:white;
}

/* MENU */

#menu{
  display:none;
  position:fixed;
  z-index:100;
  right:10px;
  top:108px;
  width:270px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.menuButton{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  padding:12px;
  text-align:left;
  border-radius:8px;
}

.menuButton:hover{
  background:var(--bar);
}

/* MODAL */

#overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.65);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
}

.modal h2{
  margin-top:0;
}

.modal input{
  width:100%;
  height:42px;
  margin:5px 0;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
  padding:0 11px;
  outline:none;
}

.modalButton{
  height:40px;
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:white;
  padding:0 15px;
  font-weight:bold;
  margin-top:8px;
}

.closeButton{
  height:40px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  padding:0 15px;
  margin-top:8px;
}

.row{
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.small{
  color:var(--muted);
  font-size:12px;
  word-break:break-all;
}
