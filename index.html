<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>IternetWorld</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0b1120;
    --bar:#111a2b;
    --card:#182338;
    --text:#f8fafc;
    --muted:#94a3b8;
    --line:#2c3a52;
    --accent:#2563eb;
}

body.light{
    --bg:#eef2f7;
    --bar:#ffffff;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --line:#cbd5e1;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* =========================
   ABAS
========================= */

#tabs{
    height:42px;
    background:var(--bar);
    display:flex;
    align-items:end;
    gap:5px;
    padding:5px 8px 0;
    border-bottom:1px solid var(--line);
}

.tab{
    height:37px;
    min-width:150px;
    max-width:240px;
    background:var(--card);
    border:1px solid var(--line);
    border-bottom:0;
    border-radius:9px 9px 0 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 11px;
    color:var(--muted);
    cursor:pointer;
}

.tab.active{
    background:var(--bg);
    color:var(--text);
}

.tab-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.tab-close{
    margin-left:12px;
    cursor:pointer;
}

.new-tab{
    width:38px;
    height:37px;
    border:0;
    background:transparent;
    color:var(--text);
    font-size:23px;
    cursor:pointer;
}

/* =========================
   BARRA
========================= */

.toolbar{
    height:58px;
    background:var(--bar);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 10px;
}

.tool{
    width:38px;
    height:38px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:var(--text);
    font-size:19px;
    cursor:pointer;
}

.tool:hover{
    background:var(--card);
}

.address{
    flex:1;
    height:40px;
    display:flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
}

.address input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    padding:0 14px;
    font-size:14px;
}

.address button{
    border:0;
    background:var(--accent);
    color:white;
    padding:0 20px;
    cursor:pointer;
}

/* =========================
   PÁGINA
========================= */

#page{
    height:calc(100vh - 100px);
    overflow:auto;
    background:var(--bg);
}

/* =========================
   HOME
========================= */

.home{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 20px;
}

.logo{
    font-size:64px;
    font-weight:800;
    letter-spacing:-4px;
}

.logo span{
    color:var(--accent);
}

.subtitle{
    color:var(--muted);
    font-size:16px;
    margin-top:8px;
    margin-bottom:28px;
}

.search{
    width:min(720px,90%);
    height:54px;
    display:flex;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
}

.search input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    padding:0 18px;
    font-size:16px;
}

.search button{
    border:0;
    background:var(--accent);
    color:white;
    padding:0 25px;
    cursor:pointer;
    font-weight:bold;
}

.shortcuts{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:25px;
}

.shortcuts button{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    border-radius:9px;
    padding:11px 17px;
    cursor:pointer;
}

.shortcuts button:hover{
    border-color:var(--accent);
}

.download-area{
    margin-top:28px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

.download{
    display:inline-block;
    background:var(--accent);
    color:white;
    text-decoration:none;
    padding:13px 22px;
    border-radius:9px;
    font-weight:bold;
}

.download:hover{
    filter:brightness(1.12);
}

.downloads-button{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    padding:13px 22px;
    border-radius:9px;
    cursor:pointer;
}

.info{
    color:var(--muted);
    font-size:13px;
    margin-top:28px;
}

/* =========================
   SITE
========================= */

.site{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.site-bar{
    height:40px;
    flex-shrink:0;
    background:var(--card);
    border-bottom:1px solid var(--line);
    color:var(--muted);
    display:flex;
    align-items:center;
    padding:0 14px;
    font-size:13px;
}

.site iframe{
    width:100%;
    flex:1;
    border:0;
    background:white;
}

/* =========================
   PESQUISA
========================= */

.search-page{
    max-width:1050px;
    margin:auto;
    padding:30px 20px;
}

.search-page h2{
    margin-bottom:20px;
}

.result{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
}

.result h3{
    color:#60a5fa;
    margin-bottom:8px;
}

.result p{
    color:var(--muted);
    line-height:1.5;
}

.result a{
    display:inline-block;
    margin-top:13px;
    background:var(--accent);
    color:white;
    text-decoration:none;
    padding:10px 17px;
    border-radius:8px;
}

/* =========================
   MENU
========================= */

#menu{
    position:fixed;
    right:12px;
    top:108px;
    width:255px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px;
    display:none;
    z-index:100;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

#menu.show{
    display:block;
}

.menu-item{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
}

.menu-item:hover{
    background:var(--bg);
}

/* =========================
   MODAL
========================= */

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.70);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
}

#overlay.show{
    display:flex;
}

.modal{
    width:min(650px,92%);
    max-height:80vh;
    overflow:auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
}

.modal h2{
    margin-bottom:15px;
}

.modal-close{
    float:right;
    border:0;
    background:transparent;
    color:var(--text);
    font-size:24px;
    cursor:pointer;
}

.modal-list{
    margin-top:15px;
}

.modal-list div{
    padding:12px 0;
    border-bottom:1px solid var(--line);
}

.modal-list a{
    color:#60a5fa;
    text-decoration:none;
}

.empty{
    color:var(--muted);
    margin-top:15px;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:700px){

    .logo{
        font-size:44px;
    }

    .tab{
        min-width:110px;
    }

    .tool{
        width:32px;
    }

}

</style>
</head>

<body>

<div id="tabs"></div>

<div class="toolbar">

    <button class="tool" onclick="goBack()">←</button>

    <button class="tool" onclick="goForward()">→</button>

    <button class="tool" onclick="reloadPage()">↻</button>

    <button class="tool" onclick="goHome()">⌂</button>

    <form class="address" onsubmit="navigate(event)">

        <input
            id="address"
            autocomplete="off"
            placeholder="Pesquisar ou escrever um endereço"
        >

        <button type="submit">
            Ir
        </button>

    </form>

    <button class="tool" onclick="addFavorite()">
        ★
    </button>

    <button class="tool" onclick="toggleMenu()">
        ☰
    </button>

</div>

<div id="page"></div>

<!-- MENU -->

<div id="menu">

    <button class="menu-item" onclick="openAI()">
        🤖 IternetWorld AI
    </button>

    <button class="menu-item" onclick="showFavorites()">
        ⭐ Favoritos
    </button>

    <button class="menu-item" onclick="showHistory()">
        🕘 Histórico
    </button>

    <button class="menu-item" onclick="showDownloads()">
        ⬇️ Downloads
    </button>

    <button class="menu-item" onclick="showSettings()">
        ⚙️ Configurações
    </button>

    <button class="menu-item" onclick="toggleTheme()">
        🌙 Modo escuro / claro
    </button>

</div>

<!-- MODAL -->

<div id="overlay">

    <div class="modal">

        <button
            class="modal-close"
            onclick="closeModal()"
        >
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>

<script>

/* =========================================
   DADOS
========================================= */

let tabs=[];
let active=0;

let favoritesData=
    JSON.parse(
        localStorage.getItem("iw_favorites") || "[]"
    );

let historyData=
    JSON.parse(
        localStorage.getItem("iw_history") || "[]"
    );

const DOWNLOAD_URL=
"https://github.com/JogosWorld/InternetWorld/releases/download/v1.0.0/IternetWorld.Setup.1.0.0.exe";


/* =========================================
   SEGURANÇA
========================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================
   ABAS
========================================= */

function createTab(){

    tabs.push({
        title:"Nova aba",
        url:""
    });

    active=tabs.length-1;

    renderTabs();

    goHome();
}

function renderTabs(){

    const box=
        document.getElementById("tabs");

    box.innerHTML="";

    tabs.forEach((tab,index)=>{

        const element=
            document.createElement("div");

        element.className=
            "tab"+
            (index===active ? " active" : "");

        element.innerHTML=`

            <span class="tab-title">
                ${escapeHTML(tab.title)}
            </span>

            <span
                class="tab-close"
                onclick="
                    event.stopPropagation();
                    closeTab(${index})
                "
            >
                ×
            </span>

        `;

        element.onclick=function(){

            active=index;

            renderTabs();

            showTab();

        };

        box.appendChild(element);

    });

    const newButton=
        document.createElement("button");

    newButton.className="new-tab";

    newButton.textContent="+";

    newButton.onclick=createTab;

    box.appendChild(newButton);
}

function closeTab(index){

    tabs.splice(index,1);

    if(tabs.length===0){

        createTab();

        return;
    }

    if(active>=tabs.length){

        active=tabs.length-1;
    }

    renderTabs();

    showTab();
}

function showTab(){

    const tab=tabs[active];

    if(!tab.url){

        goHome();

        return;
    }

    if(tab.url.startsWith("search:")){

        searchWeb(
            tab.url.substring(7),
            false
        );

        return;
    }

    openSite(tab.url,false);
}


/* =========================================
   HOME
========================================= */

function goHome(){

    tabs[active].title="Nova aba";
    tabs[active].url="";

    document.getElementById("address").value="";

    renderTabs();

    document.getElementById("page").innerHTML=`

        <div class="home">

            <div class="logo">
                Iternet<span>World</span>
            </div>

            <div class="subtitle">
                Pesquisa e navegação num só lugar.
            </div>

            <form
                class="search"
                onsubmit="homeSearch(event)"
            >

                <input
                    id="homeInput"
                    autocomplete="off"
                    placeholder="Pesquisar ou escrever um endereço"
                >

                <button>
                    Pesquisar
                </button>

            </form>

            <div class="shortcuts">

                <button
                    onclick="
                        openSite('https://www.youtube.com/')
                    "
                >
                    ▶️ YouTube
                </button>

                <button
                    onclick="
                        openSite('https://www.google.com/')
                    "
                >
                    🔎 Google
                </button>

                <button
                    onclick="
                        openSite('https://github.com/')
                    "
                >
                    💻 GitHub
                </button>

                <button
                    onclick="
                        openSite('https://www.minecraft.net/')
                    "
                >
                    ⛏️ Minecraft
                </button>

                <button onclick="openAI()">
                    🤖 IternetWorld AI
                </button>

            </div>

            <div class="download-area">

                <a
                    class="download"
                    href="${DOWNLOAD_URL}"
                    download
                >
                    ⬇️ Download IternetWorld
                </a>

                <button
                    class="downloads-button"
                    onclick="showDownloads()"
                >
                    📥 Downloads
                </button>

            </div>

            <div class="info">
                O IternetWorld tem abas, favoritos,
                histórico, modo escuro e muito mais.
            </div>

        </div>

    `;
}

function homeSearch(event){

    event.preventDefault();

    const value=
        document.getElementById("homeInput")
        .value
        .trim();

    if(value){

        navigateValue(value);
    }
}


/* =========================================
   NAVEGAÇÃO
========================================= */

function navigate(event){

    event.preventDefault();

    const value=
        document.getElementById("address")
        .value
        .trim();

    if(value){

        navigateValue(value);
    }
}

function navigateValue(value){

    const isURL=
        /^https?:\/\//i.test(value) ||
        /^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/.*)?$/i.test(value);

    if(isURL){

        const url=
            /^https?:\/\//i.test(value)
            ? value
            : "https://"+value;

        openSite(url);

    }else{

        searchWeb(value);
    }
}


/* =========================================
   PESQUISA DUCKDUCKGO
========================================= */

async function searchWeb(text,record=true){

    text=text.trim();

    if(!text)return;

    tabs[active].title=
        "Pesquisa: "+text;

    tabs[active].url=
        "search:"+text;

    document.getElementById("address").value=text;

    renderTabs();

    const query=
        encodeURIComponent(text);

    /*
       ELECTRON
       Usa o main.js que já tens.
    */

    if(
        typeof window.require==="function"
    ){

        try{

            const {
                ipcRenderer
            }=window.require("electron");

            const results=
                await ipcRenderer.invoke(
                    "pesquisar-internet",
                    text
                );

            renderElectronResults(
                text,
                results
            );

            saveHistory(
                "Pesquisa: "+text,
                "https://duckduckgo.com/?q="+query,
                record
            );

            return;

        }catch(error){

            console.log(
                "Pesquisa Electron:",
                error
            );
        }
    }

    /*
       GITHUB PAGES / NAVEGADOR NORMAL
    */

    renderBrowserSearch(text);

    saveHistory(
        "Pesquisa: "+text,
        "https://duckduckgo.com/?q="+query,
        record
    );
}


/* =========================================
   RESULTADOS ELECTRON
========================================= */

function renderElectronResults(text,results){

    let html=`

        <div class="search-page">

            <h2>
                🔎 Resultados para
                "${escapeHTML(text)}"
            </h2>

    `;

    if(
        Array.isArray(results) &&
        results.length
    ){

        results.forEach(result=>{

            const title=
                result.title ||
                "Resultado";

            const url=
                result.url ||
                "#";

            const snippet=
                result.snippet ||
                "";

            html+=`

                <div class="result">

                    <h3>
                        ${escapeHTML(title)}
                    </h3>

                    <p>
                        ${escapeHTML(snippet)}
                    </p>

                    <a
                        href="#"
                        onclick="
                            event.preventDefault();
                            openSite(
                                '${escapeHTML(url)}'
                            );
                        "
                    >
                        Abrir
                    </a>

                </div>

            `;

        });

    }else{

        html+=`

            <div class="result">

                <h3>
                    DuckDuckGo
                </h3>

                <p>
                    Não foi possível obter os
                    resultados diretamente.
                </p>

                <a
                    href="https://duckduckgo.com/?q=${encodeURIComponent(text)}"
                    target="_blank"
                >
                    Abrir DuckDuckGo
                </a>

            </div>

        `;
    }

    html+=`

        </div>

    `;

    document.getElementById("page").innerHTML=html;
}


/* =========================================
   PESQUISA NO NAVEGADOR
========================================= */

function renderBrowserSearch(text){

    const query=
        encodeURIComponent(text);

    document.getElementById("page").innerHTML=`

        <div class="search-page">

            <h2>
                🔎 Resultados para
                "${escapeHTML(text)}"
            </h2>

            <div class="result">

                <h3>
                    🦆 DuckDuckGo
                </h3>

                <p>
                    Pesquisa na Internet através
                    do DuckDuckGo.
                </p>

                <a
                    href="https://duckduckgo.com/?q=${query}"
                    target="_blank"
                >
                    🔎 Pesquisar no DuckDuckGo
                </a>

            </div>

            <div class="result">

                <h3>
                    Pesquisa dentro do IternetWorld
                </h3>

                <p>
                    Alguns navegadores impedem que
                    o DuckDuckGo seja mostrado dentro
                    de uma iframe.
                </p>

            </div>

        </div>

    `;
}


/* =========================================
   HISTÓRICO
========================================= */

function saveHistory(title,url,save=true){

    if(!save)return;

    historyData.unshift({

        title:title,

        url:url,

        time:
            new Date()
            .toLocaleString("pt-PT")
    });

    historyData=
        historyData.slice(0,300);

    localStorage.setItem(
        "iw_history",
        JSON.stringify(historyData)
    );
}


/* =========================================
   ABRIR SITE
========================================= */

function openSite(url,record=true){

    try{

        const parsed=
            new URL(url);

        tabs[active].url=url;

        tabs[active].title=
            parsed.hostname
            .replace(/^www\./,"");

        document.getElementById("address").value=url;

        renderTabs();

        if(record){

            saveHistory(
                tabs[active].title,
                url,
                true
            );
        }

        document.getElementById("page").innerHTML=`

            <div class="site">

                <div class="site-bar">

                    🌐
                    ${escapeHTML(
                        parsed.hostname
                    )}

                </div>

                <iframe
                    src="${escapeHTML(url)}"
                    allow="
                        fullscreen;
                        autoplay;
                        encrypted-media;
                        picture-in-picture
                    "
                ></iframe>

            </div>

        `;

    }catch(error){

        searchWeb(url);
    }
}


/* =========================================
   BOTÕES
========================================= */

function goBack(){

    const iframe=
        document.querySelector(".site iframe");

    if(iframe){

        try{
            iframe.contentWindow.history.back();
        }catch(e){}

    }
}

function goForward(){

    const iframe=
        document.querySelector(".site iframe");

    if(iframe){

        try{
            iframe.contentWindow.history.forward();
        }catch(e){}

    }
}

function reloadPage(){

    const iframe=
        document.querySelector(".site iframe");

    if(iframe){

        iframe.src=iframe.src;

    }else{

        showTab();
    }
}


/* =========================================
   FAVORITOS
========================================= */

function addFavorite(){

    const tab=tabs[active];

    if(
        !tab.url ||
        tab.url.startsWith("search:")
    ){

        alert(
            "Abre primeiro um site para o adicionar aos favoritos."
        );

        return;
    }

    if(
        favoritesData.some(
            item=>item.url===tab.url
        )
    ){

        alert(
            "Este site já está nos favoritos."
        );

        return;
    }

    favoritesData.push({

        title:tab.title,

        url:tab.url
    });

    localStorage.setItem(
        "iw_favorites",
        JSON.stringify(favoritesData)
    );

    alert(
        "⭐ Adicionado aos favoritos!"
    );
}


/* =========================================
   MENU
========================================= */

function toggleMenu(){

    document
        .getElementById("menu")
        .classList.toggle("show");
}


/* =========================================
   MODAL
========================================= */

function showModal(html){

    document.getElementById(
        "modalContent"
    ).innerHTML=html;

    document
        .getElementById("overlay")
        .classList.add("show");
}

function closeModal(){

    document
        .getElementById("overlay")
        .classList.remove("show");
}


/* =========================================
   FAVORITOS
========================================= */

function showFavorites(){

    closeMenu();

    let html=`
        <h2>⭐ Favoritos</h2>
        <div class="modal-list">
    `;

    if(!favoritesData.length){

        html+=`
            <p class="empty">
                Ainda não tens favoritos.
            </p>
        `;

    }else{

        favoritesData.forEach((item,index)=>{

            html+=`

                <div>

                    <a
                        href="#"
                        onclick="
                            event.preventDefault();
                            closeModal();
                            openSite(
                                '${escapeHTML(item.url)}'
                            );
                        "
                    >
                        ${escapeHTML(item.title)}
                    </a>

                    <br>

                    <small>
                        ${escapeHTML(item.url)}
                    </small>

                </div>

            `;

        });
    }

    html+=`</div>`;

    showModal(html);
}


/* =========================================
   HISTÓRICO
========================================= */

function showHistory(){

    closeMenu();

    let html=`
        <h2>🕘 Histórico</h2>
        <div class="modal-list">
    `;

    if(!historyData.length){

        html+=`
            <p class="empty">
                O histórico está vazio.
            </p>
        `;

    }else{

        historyData.forEach(item=>{

            html+=`

                <div>

                    <b>
                        ${escapeHTML(item.title)}
                    </b>

                    <br>

                    <small>
                        ${escapeHTML(item.url)}
                    </small>

                    <br>

                    <small>
                        ${escapeHTML(item.time)}
                    </small>

                </div>

            `;

        });
    }

    html+=`</div>`;

    showModal(html);
}

   CONFIGURAÇÕES
========================================= */

function showSettings(){

/* =========================================
   TEMA
========================================= */

function toggleTheme(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "iw_theme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );
}

if(
    localStorage.getItem("iw_theme")
    ===
    "light"
){

    document.body.classList.add("light");
}


/* =========================================
   AI
========================================= */

function openAI(){

    closeMenu();

    showModal(`

        <h2>
            🤖 IternetWorld AI
        </h2>

        <p class="empty">
            Escreve uma pergunta para o IternetWorld AI.
        </p>

        <br>

        <input
            id="aiQuestion"
            placeholder="Escreve a tua pergunta..."
            style="
                width:100%;
                height:45px;
                padding:10px;
                border-radius:8px;
                border:1px solid var(--line);
                background:var(--bg);
                color:var(--text);
                outline:none;
            "
        >

        <button
            onclick="askAI()"
            style="
                width:100%;
                margin-top:10px;
                height:44px;
                border:0;
                border-radius:8px;
                background:var(--accent);
                color:white;
                cursor:pointer;
            "
        >
            Perguntar
        </button>

        <div
            id="aiAnswer"
            style="
                margin-top:18px;
                color:var(--muted);
            "
        ></div>

    `);
}

function askAI(){

    const input=
        document.getElementById("aiQuestion");

    const answer=
        document.getElementById("aiAnswer");

    if(!input.value.trim()){

        answer.innerHTML=
            "Escreve primeiro uma pergunta.";

        return;
    }

    answer.innerHTML=`

        <b style="color:var(--text)">
            Pergunta:
        </b>

        ${escapeHTML(input.value)}

        <br><br>

        O IternetWorld AI está preparado.
        Para obter respostas reais de IA,
        será necessário ligar esta função
        a um serviço de inteligência artificial.

    `;
}


/* =========================================
   FECHAR MENU
========================================= */

function closeMenu(){

    document
        .getElementById("menu")
        .classList.remove("show");
}


/* =========================================
   INICIAR
========================================= */

createTab();
