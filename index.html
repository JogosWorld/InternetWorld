<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IternetWorld</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0b1120;
    --bar:#111a2b;
    --card:#182338;
    --text:#f8fafc;
    --muted:#94a3b8;
    --line:#2c3a52;
    --accent:#2563eb;
}

body.light{
    --bg:#eef2f7;
    --bar:#ffffff;
    --card:#ffffff;
    --text:#172033;
    --muted:#64748b;
    --line:#cbd5e1;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* ABAS */

#tabs{
    height:42px;
    background:var(--bar);
    display:flex;
    align-items:flex-end;
    padding:0 8px;
    gap:5px;
    border-bottom:1px solid var(--line);
}

.tab{
    height:36px;
    min-width:150px;
    max-width:230px;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--card);
    border-radius:9px 9px 0 0;
    cursor:pointer;
    color:var(--muted);
}

.tab.active{
    background:var(--bg);
    color:var(--text);
}

.tab-title{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    flex:1;
}

.close{
    font-size:18px;
    cursor:pointer;
}

.newtab{
    width:36px;
    height:34px;
    border:0;
    background:transparent;
    color:var(--text);
    font-size:22px;
    cursor:pointer;
}

/* BARRA */

#toolbar{
    height:58px;
    background:var(--bar);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px;
}

.logo-small{
    font-weight:bold;
    font-size:18px;
    margin:0 8px;
    color:var(--text);
}

.tool{
    width:36px;
    height:36px;
    border:0;
    border-radius:8px;
    background:var(--card);
    color:var(--text);
    cursor:pointer;
    font-size:17px;
}

.tool:hover{
    background:var(--accent);
}

#addressForm{
    display:flex;
    flex:1;
    height:38px;
}

#address{
    flex:1;
    border:1px solid var(--line);
    border-radius:9px 0 0 9px;
    outline:none;
    padding:0 14px;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
}

#goButton{
    width:50px;
    border:0;
    border-radius:0 9px 9px 0;
    background:var(--accent);
    color:white;
    cursor:pointer;
    font-weight:bold;
}

#loginButton{
    height:36px;
    padding:0 13px;
    border:0;
    border-radius:8px;
    background:var(--accent);
    color:white;
    cursor:pointer;
    font-weight:bold;
}

/* PÁGINA */

#page{
    height:calc(100vh - 100px);
    overflow:auto;
}

.home{
    min-height:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:70px 20px;
}

.home-box{
    width:min(900px,100%);
    text-align:center;
}

.logo{
    font-size:58px;
    font-weight:bold;
    margin-bottom:10px;
}

.logo span{
    color:var(--accent);
}

.subtitle{
    color:var(--muted);
    margin-bottom:30px;
    font-size:17px;
}

.search-home{
    display:flex;
    width:min(700px,100%);
    margin:auto;
}

.search-home input{
    flex:1;
    height:50px;
    border:1px solid var(--line);
    border-radius:12px 0 0 12px;
    padding:0 18px;
    outline:none;
    background:var(--card);
    color:var(--text);
    font-size:16px;
}

.search-home button{
    width:80px;
    border:0;
    border-radius:0 12px 12px 0;
    background:var(--accent);
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.shortcuts{
    margin-top:35px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.shortcut{
    padding:12px 18px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    cursor:pointer;
}

.shortcut:hover{
    border-color:var(--accent);
}

.info{
    margin-top:35px;
    color:var(--muted);
}

/* SITE */

.site-page{
    height:100%;
    display:flex;
    flex-direction:column;
}

.site-head{
    height:45px;
    background:var(--card);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    padding:0 15px;
    color:var(--muted);
}

.site-frame{
    flex:1;
    width:100%;
    border:0;
    background:white;
}

/* RESULTADOS */

.results{
    max-width:900px;
    margin:auto;
    padding:30px 20px;
}

.result-title{
    font-size:25px;
    margin-bottom:20px;
}

.result{
    padding:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:12px;
    cursor:pointer;
}

.result:hover{
    border-color:var(--accent);
}

.result h3{
    color:var(--accent);
    margin-bottom:7px;
}

.result p{
    color:var(--muted);
}

/* MENU */

#menu{
    position:fixed;
    top:100px;
    right:10px;
    width:260px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    display:none;
    z-index:50;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

#menu.open{
    display:block;
}

.menu-item{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}

.menu-item:hover{
    background:var(--bg);
}

/* OVERLAY */

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

#overlay.show{
    display:flex;
}

.modal{
    width:min(400px,90%);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:15px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal h2{
    margin-bottom:20px;
}

.modal input{
    width:100%;
    height:45px;
    margin-bottom:12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
    color:var(--text);
    padding:0 12px;
    outline:none;
}

.modal button{
    width:100%;
    height:44px;
    margin-top:7px;
    border:0;
    border-radius:8px;
    background:var(--accent);
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.modal .cancel{
    background:var(--line);
    color:var(--text);
}

.login-message{
    margin-top:12px;
    color:var(--muted);
    text-align:center;
    min-height:20px;
}

/* RESPONSIVO */

@media(max-width:700px){
    .logo-small{
        display:none;
    }

    .tab{
        min-width:110px;
    }

    #loginButton{
        padding:0 8px;
        font-size:12px;
    }

    .logo{
        font-size:42px;
    }
}
</style>
</head>

<body>

<!-- ABAS -->
<div id="tabs"></div>

<!-- BARRA -->
<div id="toolbar">

    <div class="logo-small">IternetWorld</div>

    <button class="tool" onclick="goBack()" title="Voltar">←</button>
    <button class="tool" onclick="goForward()" title="Avançar">→</button>
    <button class="tool" onclick="reloadPage()" title="Atualizar">↻</button>
    <button class="tool" onclick="goHome()" title="Início">⌂</button>

    <form id="addressForm" onsubmit="navigate(event)">
        <input
            id="address"
            autocomplete="off"
            placeholder="Pesquisar ou escrever um endereço"
        >
        <button id="goButton">Ir</button>
    </form>

    <button class="tool" onclick="addFavorite()" title="Adicionar aos favoritos">★</button>

    <button id="loginButton" onclick="openLogin()">👤 Entrar</button>

    <button class="tool" onclick="toggleMenu()" title="Menu">☰</button>

</div>

<!-- PÁGINA -->
<div id="page"></div>

<!-- MENU -->
<div id="menu">

    <button class="menu-item" onclick="openLogin();toggleMenu();">
        👤 Início de sessão
    </button>

    <button class="menu-item" onclick="showFavorites();toggleMenu();">
        ⭐ Favoritos
    </button>

    <button class="menu-item" onclick="showHistory();toggleMenu();">
        🕘 Histórico
    </button>

    <button class="menu-item" onclick="showDownloads();toggleMenu();">
        ⬇️ Downloads
    </button>

    <button class="menu-item" onclick="toggleTheme();toggleMenu();">
        🌙 Modo escuro/claro
    </button>

    <button class="menu-item" onclick="changeAccent();toggleMenu();">
        🎨 Alterar cor
    </button>

    <button class="menu-item" onclick="goHome();toggleMenu();">
        🏠 Página inicial
    </button>

</div>

<!-- LOGIN -->
<div id="overlay">

    <div class="modal">

        <h2>🔐 IternetWorld</h2>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Palavra-passe"
        >

        <button onclick="login()">Entrar</button>

        <button onclick="register()">Criar conta</button>

        <button class="cancel" onclick="closeLogin()">Cancelar</button>

        <div id="loginMessage" class="login-message"></div>

    </div>

</div>

<script>

let tabs = [];
let active = 0;

const FAV_KEY = "iw_favorites";
const HISTORY_KEY = "iw_history";
const DOWNLOAD_KEY = "iw_downloads";
const USERS_KEY = "IternetWorldUsers";
const CURRENT_USER_KEY = "IternetWorldCurrentUser";

let favorites = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
let downloads = JSON.parse(localStorage.getItem(DOWNLOAD_KEY) || "[]");

const sites = [
    {
        name:"YouTube",
        keys:["youtube","youtube.com"],
        url:"https://www.youtube.com/"
    },
    {
        name:"Google",
        keys:["google","google.com"],
        url:"https://www.google.com/"
    },
    {
        name:"GitHub",
        keys:["github","github.com"],
        url:"https://github.com/"
    },
    {
        name:"Facebook",
        keys:["facebook","facebook.com"],
        url:"https://www.facebook.com/"
    },
    {
        name:"Instagram",
        keys:["instagram","instagram.com"],
        url:"https://www.instagram.com/"
    },
    {
        name:"TikTok",
        keys:["tiktok","tiktok.com"],
        url:"https://www.tiktok.com/"
    },
    {
        name:"Wikipedia",
        keys:["wikipedia","wikipedia.org"],
        url:"https://pt.wikipedia.org/"
    },
    {
        name:"Twitch",
        keys:["twitch","twitch.tv"],
        url:"https://www.twitch.tv/"
    }
];

function save(){

    localStorage.setItem(FAV_KEY,JSON.stringify(favorites));
    localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(0,300)));
    localStorage.setItem(DOWNLOAD_KEY,JSON.stringify(downloads));

}

function esc(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function makeURL(value){

    if(/^https?:\/\//i.test(value)){
        return value;
    }

    return "https://" + value;

}

function isURL(value){

    return /^https?:\/\//i.test(value) ||
           /^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(value);

}

/* ABAS */

function createTab(){

    tabs.push({
        title:"Nova aba",
        url:""
    });

    active = tabs.length - 1;

    renderTabs();
    goHome();

}

function renderTabs(){

    const box = document.getElementById("tabs");

    box.innerHTML = "";

    tabs.forEach((tab,index)=>{

        const el = document.createElement("div");

        el.className = "tab" + (index === active ? " active" : "");

        el.onclick = ()=>showTab(index);

        el.innerHTML = `
            <span class="tab-title">${esc(tab.title)}</span>
            <span class="close" onclick="event.stopPropagation();closeTab(${index})">×</span>
        `;

        box.appendChild(el);

    });

    const plus = document.createElement("button");

    plus.className = "newtab";
    plus.innerText = "+";
    plus.onclick = createTab;

    box.appendChild(plus);

}

function showTab(index){

    active = index;

    renderTabs();

    const tab = tabs[active];

    if(!tab.url){
        goHome(false);
        return;
    }

    if(tab.url.startsWith("search:")){
        searchWeb(tab.url.substring(7),false);
        return;
    }

    renderSite(tab.url);

}

function closeTab(index){

    tabs.splice(index,1);

    if(tabs.length === 0){
        createTab();
        return;
    }

    if(active >= tabs.length){
        active = tabs.length - 1;
    }

    showTab(active);

}

/* NAVEGAÇÃO */

function navigate(event){

    event.preventDefault();

    const value = document
        .getElementById("address")
        .value
        .trim();

    if(!value) return;

    if(isURL(value)){
        openSite(makeURL(value));
    }else{
        searchWeb(value);
    }

}

function goHome(update=true){

    if(!tabs.length) return;

    const tab = tabs[active];

    tab.title = "Nova aba";
    tab.url = "";

    renderTabs();

    document.getElementById("address").value = "";

    document.getElementById("page").innerHTML = `

        <div class="home">

            <div class="home-box">

                <div class="logo">
                    Iternet<span>World</span>
                </div>

                <div class="subtitle">
                    Pesquisa e navegação num só lugar.
                </div>

                <form class="search-home" onsubmit="homeSearch(event)">

                    <input
                        id="homeInput"
                        placeholder="Pesquisar ou escrever um endereço"
                        autocomplete="off"
                    >

                    <button>Pesquisar</button>

                </form>

                <div class="shortcuts">

                    <button class="shortcut"
                        onclick="openSite('https://www.youtube.com/')">
                        ▶️ YouTube
                    </button>

                    <button class="shortcut"
                        onclick="openSite('https://www.google.com/')">
                        🔎 Google
                    </button>

                    <button class="shortcut"
                        onclick="openSite('https://github.com/')">
                        💻 GitHub
                    </button>

                    <button class="shortcut"
                        onclick="openSite('https://www.minecraft.net/')">
                        ⛏️ Minecraft
                    </button>

                    <button class="shortcut"
                        onclick="openAI()">
                        🤖 IternetWorld AI
                    </button>

                </div>

                <div class="info">
                    Abas • Favoritos • Histórico • Downloads • Modo escuro • Login
                </div>

            </div>

        </div>

    `;

}

function homeSearch(event){

    event.preventDefault();

    const value = document
        .getElementById("homeInput")
        .value
        .trim();

    if(!value) return;

    if(isURL(value)){
        openSite(makeURL(value));
    }else{
        searchWeb(value);
    }

}

function openAI(){

    searchWeb("IternetWorld AI");

}

/* SITES */

function openSite(url,record=true){

    tabs[active].url = url;

    try{

        tabs[active].title =
            new URL(url).hostname.replace(/^www\./,"");

    }catch{

        tabs[active].title = "IternetWorld";

    }

    renderTabs();

    document.getElementById("address").value = url;

    if(record){

        history.unshift({
            title:tabs[active].title,
            url:url,
            time:new Date().toLocaleString("pt-PT")
        });

        history = history.slice(0,300);

        save();

    }

    renderSite(url);

}

function renderSite(url){

    document.getElementById("page").innerHTML = `

        <div class="site-page">

            <div class="site-head">
                🌐 ${esc(tabs[active].title)}
            </div>

            <iframe
                class="site-frame"
                src="${esc(url)}"
                allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
            ></iframe>

        </div>

    `;

}

/* PESQUISA */

function searchWeb(query,record=true){

    query = query.trim();

    if(!query) return;

    const known = sites.find(site =>
        site.keys.some(key =>
            query.toLowerCase().includes(key)
        )
    );

    if(known){

        openSite(known.url,record);
        return;

    }

    tabs[active].url = "search:" + query;
    tabs[active].title = query;

    renderTabs();

    document.getElementById("address").value = query;

    if(record){

        history.unshift({
            title:"Pesquisa: " + query,
            url:"search:" + query,
            time:new Date().toLocaleString("pt-PT")
        });

        save();

    }

    const encoded = encodeURIComponent(query);

    document.getElementById("page").innerHTML = `

        <div class="results">

            <div class="result-title">
                Resultados para: <b>${esc(query)}</b>
            </div>

            <div class="result"
                onclick="openSite('https://www.google.com/search?q=${encoded}')">

                <h3>🔎 Pesquisar no Google</h3>

                <p>
                    Abrir resultados da pesquisa no Google.
                </p>

            </div>

            <div class="result"
                onclick="openSite('https://www.youtube.com/results?search_query=${encoded}')">

                <h3>▶️ Pesquisar no YouTube</h3>

                <p>
                    Procurar vídeos relacionados com "${esc(query)}".
                </p>

            </div>

            <div class="result"
                onclick="openSite('https://pt.wikipedia.org/wiki/Especial:Pesquisar?search=${encoded}')">

                <h3>📚 Pesquisar na Wikipédia</h3>

                <p>
                    Procurar informação na Wikipédia.
                </p>

            </div>

        </div>

    `;

}

/* FAVORITOS */

function addFavorite(){

    const tab = tabs[active];

    if(!tab.url || tab.url.startsWith("search:")){
        alert("Abre primeiro um site para adicionar aos favoritos.");
        return;
    }

    if(favorites.some(f=>f.url===tab.url)){
        alert("Este site já está nos favoritos.");
        return;
    }

    favorites.unshift({
        title:tab.title,
        url:tab.url
    });

    save();

    alert("Adicionado aos favoritos ⭐");

}

function showFavorites(){

    if(!favorites.length){

        document.getElementById("page").innerHTML = `
            <div class="results">
                <div class="result-title">⭐ Favoritos</div>
                <div class="result">
                    <p>Ainda não tens favoritos.</p>
                </div>
            </div>
        `;

        return;

    }

    document.getElementById("page").innerHTML = `

        <div class="results">

            <div class="result-title">⭐ Favoritos</div>

            ${favorites.map((f,i)=>`

                <div class="result"
                    onclick="openSite('${esc(f.url)}')">

                    <h3>${esc(f.title)}</h3>
                    <p>${esc(f.url)}</p>

                </div>

            `).join("")}

        </div>

    `;

}

/* HISTÓRICO */

function showHistory(){

    document.getElementById("page").innerHTML = `

        <div class="results">

            <div class="result-title">🕘 Histórico</div>

            ${
                history.length
                ?
                history.map(h=>`

                    <div class="result"
                        onclick="openHistory('${encodeURIComponent(h.url)}')">

                        <h3>${esc(h.title)}</h3>
                        <p>${esc(h.time)}</p>

                    </div>

                `).join("")
                :
                `
                <div class="result">
                    <p>O histórico está vazio.</p>
                </div>
                `
            }

        </div>

    `;

}

function openHistory(encoded){

    const url = decodeURIComponent(encoded);

    if(url.startsWith("search:")){
        searchWeb(url.substring(7),false);
    }else{
        openSite(url,false);
    }

}

/* DOWNLOADS */

function showDownloads(){

    document.getElementById("page").innerHTML = `

        <div class="results">

            <div class="result-title">⬇️ Downloads</div>

            <div class="result">

                <h3>IternetWorld</h3>

                <p>
                    Página de downloads e aplicações.
                </p>

                <br>

                <button
                    class="shortcut"
                    onclick="window.open('https://github.com/JogosWorld/InternetWorld/releases','_blank')">
                    📥 Abrir Downloads
                </button>

            </div>

        </div>

    `;

}

/* MENU */

function toggleMenu(){

    document.getElementById("menu")
        .classList.toggle("open");

}

/* TEMA */

function toggleTheme(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "iw_theme",
        document.body.classList.contains("light")
        ? "light"
        : "dark"
    );

}

if(localStorage.getItem("iw_theme")==="light"){
    document.body.classList.add("light");
}

/* COR */

function changeAccent(){

    const colors = [
        "#2563eb",
        "#7c3aed",
        "#16a34a",
        "#dc2626",
        "#ea580c",
        "#0891b2"
    ];

    const current =
        getComputedStyle(document.documentElement)
        .getPropertyValue("--accent")
        .trim();

    let index = colors.indexOf(current);

    index++;

    if(index >= colors.length){
        index=0;
    }

    document.documentElement
        .style
        .setProperty("--accent",colors[index]);

    localStorage.setItem("iw_accent",colors[index]);

}

const savedAccent = localStorage.getItem("iw_accent");

if(savedAccent){
    document.documentElement
        .style
        .setProperty("--accent",savedAccent);
}

/* VOLTAR / AVANÇAR */

function goBack(){

    const frame = document.querySelector(".site-frame");

    if(frame){

        try{
            frame.contentWindow.history.back();
            return;
        }catch{}

    }

    historyBack();

}

function goForward(){

    const frame = document.querySelector(".site-frame");

    if(frame){

        try{
            frame.contentWindow.history.forward();
            return;
        }catch{}

    }

}

function historyBack(){

    if(history.length > 1){

        const previous = history[1];

        if(previous.url.startsWith("search:")){
            searchWeb(previous.url.substring(7),false);
        }else{
            openSite(previous.url,false);
        }

    }

}

function reloadPage(){

    const frame = document.querySelector(".site-frame");

    if(frame){

        try{
            frame.contentWindow.location.reload();
        }catch{
            frame.src = frame.src;
        }

    }else{

        showTab(active);

    }

}

/* LOGIN */

function openLogin(){

    document.getElementById("overlay")
        .classList.add("show");

    document.getElementById("loginMessage")
        .textContent = "";

    const current =
        localStorage.getItem(CURRENT_USER_KEY);

    if(current){

        document.getElementById("email").value = current;

    }

}

function closeLogin(){

    document.getElementById("overlay")
        .classList.remove("show");

}

function getUsers(){

    return JSON.parse(
        localStorage.getItem(USERS_KEY) || "[]"
    );

}

function saveUsers(users){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

}

function login(){

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("loginMessage");

    if(!email || !password){

        message.textContent =
            "Preenche o email e a palavra-passe.";

        return;

    }

    const users = getUsers();

    const user = users.find(
        u => u.email === email &&
             u.password === password
    );

    if(!user){

        message.textContent =
            "Email ou palavra-passe incorretos.";

        return;

    }

    localStorage.setItem(
        CURRENT_USER_KEY,
        email
    );

    updateLoginButton();

    message.textContent =
        "Login efetuado com sucesso!";

    setTimeout(closeLogin,700);

}

function register(){

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("loginMessage");

    if(!email || !password){

        message.textContent =
            "Preenche o email e a palavra-passe.";

        return;

    }

    if(password.length < 4){

        message.textContent =
            "A palavra-passe deve ter pelo menos 4 caracteres.";

        return;

    }

    const users = getUsers();

    if(users.some(u=>u.email===email)){

        message.textContent =
            "Esta conta já existe.";

        return;

    }

    users.push({
        email:email,
        password:password
    });

    saveUsers(users);

    localStorage.setItem(
        CURRENT_USER_KEY,
        email
    );

    updateLoginButton();

    message.textContent =
        "Conta criada com sucesso!";

    setTimeout(closeLogin,700);

}

function logout(){

    localStorage.removeItem(CURRENT_USER_KEY);

    updateLoginButton();

}

function updateLoginButton(){

    const button =
        document.getElementById("loginButton");

    const current =
        localStorage.getItem(CURRENT_USER_KEY);

    if(current){

        button.innerText = "👤 " + current;

        button.onclick = logout;

        button.title = "Clique para terminar sessão";

    }else{

        button.innerText = "👤 Entrar";

        button.onclick = openLogin;

        button.title = "Iniciar sessão";

    }

}

/* INICIAR */

createTab();

updateLoginButton();

</script>
