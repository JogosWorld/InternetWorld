
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IternetWorld</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#07101f;
  --bar:#0d1728;
  --card:#111f35;
  --card2:#162742;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:#263853;
  --accent:#2563eb;
}

body.light{
  --bg:#eef3f9;
  --bar:#ffffff;
  --card:#ffffff;
  --card2:#f4f7fb;
  --text:#172033;
  --muted:#64748b;
  --line:#d5deea;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

button,input{font:inherit}
button{cursor:pointer}

#app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ABAS */

#tabs{
  height:50px;
  background:var(--bar);
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 8px;
  border-bottom:1px solid var(--line);
  overflow-x:auto;
}

.tab{
  height:37px;
  min-width:150px;
  max-width:240px;
  padding:0 9px 0 14px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  transition:.2s;
}

.tab:hover{
  background:var(--card2);
  color:var(--text);
}

.tab.active{
  color:var(--text);
  background:linear-gradient(135deg,var(--card2),var(--card));
  border-color:var(--line);
  box-shadow:0 0 18px rgba(37,99,235,.15);
}

.tab-title{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
  text-align:left;
}

.tab-close{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:18px;
  border-radius:7px;
}

.tab-close:hover{
  background:rgba(127,127,127,.18);
  color:var(--text);
}

.newtab{
  flex:0 0 auto;
  width:38px;
  height:37px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  font-size:21px;
}

/* BARRA */

#toolbar{
  height:59px;
  background:var(--bar);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-bottom:1px solid var(--line);
}

.logo-mini{
  font-weight:800;
  font-size:17px;
  margin-right:4px;
  white-space:nowrap;
}

.logo-mini span{
  color:var(--accent);
}

.tool{
  width:36px;
  height:36px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
}

.tool:hover{
  border-color:var(--accent);
}

#addressForm{
  flex:1;
  display:flex;
  gap:7px;
  min-width:100px;
}

#addressInput{
  width:100%;
  height:38px;
  border:1px solid var(--line);
  outline:0;
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:0 15px;
}

#addressInput:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(37,99,235,.13);
}

.goBtn{
  height:38px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:white;
  padding:0 17px;
  font-weight:700;
}

.loginBtn{
  height:36px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  border-radius:10px;
  padding:0 13px;
  font-weight:700;
}

.loginBtn:hover{
  border-color:var(--accent);
}

/* PÁGINA */

#page{
  flex:1;
  overflow:auto;
  background:var(--bg);
}

.home{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 18px;
}

.brand{
  font-size:clamp(42px,7vw,76px);
  font-weight:900;
  letter-spacing:-4px;
  margin-bottom:7px;
  text-shadow:0 0 35px rgba(37,99,235,.2);
}

.brand span{
  color:var(--accent);
}

.subtitle{
  color:var(--muted);
  font-size:16px;
  margin-bottom:28px;
}

.searchBox{
  width:min(760px,95%);
  display:flex;
  gap:9px;
}

.searchBox input{
  flex:1;
  height:54px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--card);
  color:var(--text);
  padding:0 18px;
  outline:0;
}

.searchBox input:focus{
  border-color:var(--accent);
}

.searchBox button{
  height:54px;
  border:0;
  border-radius:16px;
  background:var(--accent);
  color:white;
  padding:0 25px;
  font-weight:800;
}

.shortcuts{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:24px;
  max-width:800px;
}

.shortcut{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:11px 15px;
  border-radius:13px;
  text-decoration:none;
}

.shortcut:hover{
  border-color:var(--accent);
  transform:translateY(-2px);
}

.info{
  color:var(--muted);
  margin-top:25px;
  font-size:13px;
  text-align:center;
}

/* SITES */

.sitePage{
  height:100%;
  display:flex;
  flex-direction:column;
}

.siteBar{
  min-height:42px;
  padding:0 15px;
  display:flex;
  align-items:center;
  gap:9px;
  background:var(--card);
  border-bottom:1px solid var(--line);
  font-size:13px;
  color:var(--muted);
}

.siteDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
}

.siteFrame{
  border:0;
  flex:1;
  width:100%;
  background:white;
}

/* MENU */

#menu{
  position:fixed;
  right:12px;
  top:112px;
  width:290px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  z-index:20;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  display:none;
}

.menuItem{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  padding:12px;
  text-align:left;
  border-radius:11px;
  display:flex;
  justify-content:space-between;
}

.menuItem:hover{
  background:var(--card2);
}

.menuTitle{
  padding:10px 12px;
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
}

/* MODAL */

#overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(460px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.modal h2{
  margin:0 0 8px;
}

.modal p{
  color:var(--muted);
}

.modal input{
  width:100%;
  height:43px;
  margin:7px 0;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  border-radius:10px;
  padding:0 12px;
  outline:0;
}

.modalActions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.primary{
  flex:1;
  border:0;
  background:var(--accent);
  color:#fff;
  border-radius:10px;
  height:43px;
  font-weight:700;
}

.secondary{
  border:1px solid var(--line);
  background:var(--card2);
  color:var(--text);
  border-radius:10px;
  padding:0 15px;
  min-height:40px;
}

.list{
  max-height:420px;
  overflow:auto;
  margin-top:12px;
}

.listRow{
  padding:11px;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:10px;
  align-items:center;
}

.listRow div{
  flex:1;
  min-width:0;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:700px){

  .logo-mini{
    display:none;
  }

  .loginBtn{
    display:none;
  }

  #toolbar{
    padding:7px;
  }

  .tool{
    width:34px;
  }

  .goBtn{
    padding:0 12px;
  }

  .tab{
    min-width:125px;
  }

  .brand{
    letter-spacing:-2px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="tabs"></div>

  <div id="toolbar">

    <div class="logo-mini">
      Iternet<span>World</span>
    </div>

    <button class="tool" title="Voltar" onclick="goBack()">←</button>
    <button class="tool" title="Avançar" onclick="goForward()">→</button>
    <button class="tool" title="Recarregar" onclick="reloadPage()">↻</button>
    <button class="tool" title="Página inicial" onclick="goHome()">⌂</button>

    <form id="addressForm" onsubmit="navigate(event)">
      <input
        id="addressInput"
        autocomplete="off"
        placeholder="Pesquisar ou escrever um endereço">
      <button class="goBtn">Ir</button>
    </form>

    <button class="tool" title="Favorito" onclick="addFavorite()">★</button>

    <button class="loginBtn" id="loginButton" onclick="openLogin()">
      Entrar
    </button>

    <button class="tool" title="Menu" onclick="toggleMenu()">☰</button>

  </div>

  <main id="page"></main>

</div>

<div id="menu">

  <div class="menuTitle">
    IternetWorld
  </div>

  <button class="menuItem" onclick="showFavorites()">
    ⭐ Favoritos <span>›</span>
  </button>

  <button class="menuItem" onclick="showHistory()">
    🕘 Histórico <span>›</span>
  </button>

  <button class="menuItem" onclick="showDownloads()">
    ⬇ Downloads <span>›</span>
  </button>

  <button class="menuItem" onclick="openAI()">
    🤖 IternetWorld AI <span>›</span>
  </button>

  <button class="menuItem" onclick="showSettings()">
    ⚙ Configurações <span>›</span>
  </button>

  <button class="menuItem" onclick="toggleTheme()">
    🌙 Modo escuro/claro <span>›</span>
  </button>

</div>

<div id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>

const USERS_KEY="IternetWorldUsers";
const CURRENT_KEY="IternetWorldCurrentUser";
const FAV_KEY="iw_favorites";
const HIST_KEY="iw_history";
const THEME_KEY="iw_theme";
const ACCENT_KEY="iw_accent";

let tabs=[];
let active=0;

let history=
  JSON.parse(localStorage.getItem(HIST_KEY)||"[]");

let favorites=
  JSON.parse(localStorage.getItem(FAV_KEY)||"[]");

let accent=
  localStorage.getItem(ACCENT_KEY)||"#2563eb";

document.documentElement.style.setProperty(
  "--accent",
  accent
);

const knownSites=[
  ["YouTube","https://www.youtube.com/"],
  ["Google","https://www.google.com/"],
  ["GitHub","https://github.com/"],
  ["Facebook","https://www.facebook.com/"],
  ["Instagram","https://www.instagram.com/"],
  ["TikTok","https://www.tiktok.com/"],
  ["Wikipedia","https://pt.wikipedia.org/"],
  ["Twitch","https://www.twitch.tv/"]
];

function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}

function save(){

  localStorage.setItem(
    HIST_KEY,
    JSON.stringify(history.slice(0,300))
  );

  localStorage.setItem(
    FAV_KEY,
    JSON.stringify(favorites)
  );

}

function current(){
  return tabs[active];
}

function createTab(url=""){

  tabs.push({
    title:"Nova aba",
    url:url,
    back:[],
    forward:[]
  });

  active=tabs.length-1;

  renderTabs();

  if(url)
    showTab();
  else
    goHome();

}

function renderTabs(){

  const el=document.getElementById("tabs");

  el.innerHTML="";

  tabs.forEach((t,i)=>{

    const d=document.createElement("div");

    d.className="tab"+(i===active?" active":"");

    d.onclick=()=>{

      active=i;

      showTab();

      renderTabs();

    };

    const title=document.createElement("span");

    title.className="tab-title";

    title.textContent=t.title||"Nova aba";

    const x=document.createElement("button");

    x.className="tab-close";

    x.textContent="×";

    x.onclick=e=>{

      e.stopPropagation();

      closeTab(i);

    };

    d.append(title,x);

    el.appendChild(d);

  });

  const plus=document.createElement("button");

  plus.className="newtab";

  plus.textContent="+";

  plus.onclick=()=>createTab();

  el.appendChild(plus);

}

function closeTab(i){

  tabs.splice(i,1);

  if(!tabs.length){

    createTab();

    return;

  }

  if(active>=tabs.length)
    active=tabs.length-1;

  showTab();

  renderTabs();

}

function showTab(){

  if(!current()){

    createTab();

    return;

  }

  if((current().url||"").startsWith("search:")){

    renderDuckDuckGo(
      current().url.slice(7)
    );

  }

  else if(current().url){

    renderSite(
      current().url,
      false
    );

  }

  else{

    goHome();

  }

  document.getElementById(
    "addressInput"
  ).value=
    current().url &&
    !current().url.startsWith("search:")
      ?current().url
      :"";

}

function isURL(v){

  return /^https?:\/\//i.test(v) ||
    /^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v);

}

function makeURL(v){

  return /^https?:\/\//i.test(v)
    ?v
    :"https://"+v;

}

function navigate(e){

  e.preventDefault();

  const v=
    document.getElementById(
      "addressInput"
    ).value.trim();

  if(!v)return;

  if(isURL(v))
    openSiteNewTab(makeURL(v));
  else
    searchNewTab(v);

}

function goHome(){

  const t=current();

  if(t){

    t.title="Nova aba";
    t.url="";

  }

  renderTabs();

  document.getElementById(
    "addressInput"
  ).value="";

  document.getElementById("page").innerHTML=`

    <section class="home">

      <div class="brand">
        Iternet<span>World</span>
      </div>

      <div class="subtitle">
        Pesquisa e navegação num só lugar.
      </div>

      <form
        class="searchBox"
        onsubmit="homeSearch(event)">

        <input
          id="homeInput"
          placeholder="Pesquisar com DuckDuckGo..."
          autocomplete="off">

        <button>
          Pesquisar
        </button>

      </form>

      <div class="shortcuts">

        ${knownSites.map(
          ([n,u])=>
          `<button
             class="shortcut"
             onclick="openSiteNewTab('${u}')">
             ${n}
           </button>`
        ).join("")}

        <button
          class="shortcut"
          onclick="openAI()">
          🤖 IternetWorld AI
        </button>

        <a
          class="shortcut"
          href="https://github.com/JogosWorld/InternetWorld/releases/download/v1.0.0/IternetWorld.Setup.1.0.0.exe">
          ⬇ Download IternetWorld
        </a>

      </div>

      <div class="info">
        Abas · favoritos · histórico · modo escuro · personalização · IternetWorld AI
      </div>

    </section>

  `;

}

function homeSearch(e){

  e.preventDefault();

  const q=
    document.getElementById(
      "homeInput"
    ).value.trim();

  if(q)
    searchNewTab(q);

}

function searchNewTab(q){

  q=q.trim();

  if(!q)return;

  tabs.push({

    title:q,

    url:"search:"+q,

    back:[],
    forward:[]

  });

  active=tabs.length-1;

  renderTabs();

  renderDuckDuckGo(q);

}

function renderDuckDuckGo(q){

  document.getElementById(
    "addressInput"
  ).value=q;

  current().title=q;

  const url=
    "https://html.duckduckgo.com/html/?q="+
    encodeURIComponent(q);

  document.getElementById("page").innerHTML=`

    <div class="sitePage">

      <div class="siteBar">

        <span class="siteDot"></span>

        <strong>
          DuckDuckGo
        </strong>

        <span>•</span>

        <span>
          Resultados para:
          ${esc(q)}
        </span>

      </div>

      <iframe
        class="siteFrame"
        src="${url}"
        title="Resultados DuckDuckGo">
      </iframe>

    </div>

  `;

}

function openSiteNewTab(url){

  tabs.push({

    title:"A carregar…",

    url:url,

    back:[],
    forward:[]

  });

  active=tabs.length-1;

  renderTabs();

  renderSite(url,true);

}

function renderSite(url,record=true){

  try{

    const host=
      new URL(url)
      .hostname
      .replace(/^www\./,"");

    current().title=host;

  }

  catch{

    current().title=url;

  }

  document.getElementById(
    "addressInput"
  ).value=url;

  renderTabs();

  if(record){

    history.unshift({

      title:current().title,

      url:url,

      time:new Date()
        .toLocaleString("pt-PT")

    });

    history=history.slice(0,300);

    save();

  }

  document.getElementById("page").innerHTML=`

    <div class="sitePage">

      <div class="siteBar">

        <span class="siteDot"></span>

        <strong>
          ${esc(current().title)}
        </strong>

        <span>•</span>

        <span>
          ${esc(url)}
        </span>

      </div>

      <iframe
        class="siteFrame"
        src="${esc(url)}"
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture">
      </iframe>

    </div>

  `;

}

function goBack(){

  const t=current();

  if(!t)return;

  if(t.back && t.back.length){

    t.forward.unshift(t.url);

    t.url=t.back.shift();

    showTab();

  }

}

function goForward(){

  const t=current();

  if(!t)return;

  if(t.forward && t.forward.length){

    t.back.unshift(t.url);

    t.url=t.forward.shift();

    showTab();

  }

}

function reloadPage(){

  showTab();

}

function addFavorite(){

  const t=current();

  if(!t || !t.url)return;

  if(t.url.startsWith("search:"))
    return;

  if(!favorites.some(x=>x.url===t.url)){

    favorites.unshift({

      title:t.title,

      url:t.url

    });

    save();

    alert("Adicionado aos favoritos.");

  }

  else{

    alert("Já está nos favoritos.");

  }

}

function showFavorites(){

  closeMenu();

  openModal(
    "⭐ Favoritos",

    `

    <div class="list">

      ${
        favorites.length
        ?
        favorites.map(
          (f,i)=>`

          <div class="listRow">

            <div>

              <b>
                ${esc(f.title)}
              </b>

              <div class="small">
                ${esc(f.url)}
              </div>

            </div>

            <button
              class="secondary"
              onclick="openSiteNewTab('${esc(f.url)}');closeModal()">
              Abrir
            </button>

            <button
              class="secondary"
              onclick="removeFavorite(${i})">
              ×
            </button>

          </div>

        `).join("")
        :
        `<div class="empty">
          Ainda não tens favoritos.
        </div>`
      }

    </div>

    `
  );

}

function removeFavorite(i){

  favorites.splice(i,1);

  save();

  showFavorites();

}

function showHistory(){

  closeMenu();

  openModal(
    "🕘 Histórico",

    `

    <div class="list">

      ${
        history.length
        ?
        history.map(
          h=>`

          <div class="listRow">

            <div>

              <b>
                ${esc(h.title)}
              </b>

              <div class="small">
                ${esc(h.time)}
                ·
                ${esc(h.url)}
              </div>

            </div>

            <button
              class="secondary"
              onclick="openSiteNewTab('${esc(h.url)}');closeModal()">
              Abrir
            </button>

          </div>

        `).join("")
        :
        `<div class="empty">
          O histórico está vazio.
        </div>`
      }

    </div>

    ${
      history.length
      ?
      `<button
        class="secondary"
        style="margin-top:12px;width:100%"
        onclick="history=[];save();showHistory()">
        Limpar histórico
       </button>`
      :""
    }

    `
  );

}

function showDownloads(){

  closeMenu();

  openModal(

    "⬇ Downloads",

    `

    <p>
      Download oficial do IternetWorld:
    </p>

    <a
      class="goBtn"
      style="display:inline-flex;align-items:center;text-decoration:none"
      href="https://github.com/JogosWorld/InternetWorld/releases/download/v1.0.0/IternetWorld.Setup.1.0.0.exe">

      ⬇ Descarregar IternetWorld

    </a>

    `

  );

}

function openAI(){

  closeMenu();

  openModal(

    "🤖 IternetWorld AI",

    `

    <p>
      O IternetWorld AI é a área de assistência do navegador.
    </p>

    <input
      id="aiInput"
      placeholder="Escreve uma pergunta...">

    <button
      class="primary"
      onclick="askAI()">
      Perguntar
    </button>

    <div
      id="aiAnswer"
      style="margin-top:15px">
    </div>

    `

  );

}

function askAI(){

  const q=
    document.getElementById(
      "aiInput"
    ).value.trim();

  if(!q)return;

  document.getElementById(
    "aiAnswer"
  ).innerHTML=`

    <div
      style="
        padding:15px;
        border:1px solid var(--line);
        border-radius:12px;
        background:var(--card2)
      ">

      <b>
        IternetWorld AI
      </b>

      <p>
        Recebi a tua pergunta:
        <strong>${esc(q)}</strong>
      </p>

      <p class="small">
        Esta versão funciona localmente.
        Para respostas de IA reais é necessário
        ligar um serviço de IA/API.
      </p>

    </div>

  `;

}

function showSettings(){

  closeMenu();

  openModal(

    "⚙ Configurações",

    `

    <p>
      Personalização do IternetWorld
    </p>

    <label class="small">
      Cor principal
    </label>

    <input
      id="accentPicker"
      type="color"
      value="${esc(accent)}"
      style="height:50px;padding:4px">

    <div class="modalActions">

      <button
        class="primary"
        onclick="applyAccent()">
        Guardar
      </button>

      <button
        class="secondary"
        onclick="toggleTheme()">
        Tema
      </button>

    </div>

    `

  );

}

function applyAccent(){

  accent=
    document.getElementById(
      "accentPicker"
    ).value;

  localStorage.setItem(
    ACCENT_KEY,
    accent
  );

  document.documentElement.style.setProperty(
    "--accent",
    accent
  );

  closeModal();

}

function toggleTheme(){

  document.body.classList.toggle("light");

  localStorage.setItem(

    THEME_KEY,

    document.body.classList.contains("light")
      ?"light"
      :"dark"

  );

}

if(
  localStorage.getItem(THEME_KEY)==="light"
){

  document.body.classList.add("light");

}

function toggleMenu(){

  const m=
    document.getElementById("menu");

  m.style.display=
    m.style.display==="block"
      ?"none"
      :"block";

}

function closeMenu(){

  document.getElementById(
    "menu"
  ).style.display="none";

}

function openModal(title,body){

  document.getElementById(
    "modal"
  ).innerHTML=`

    <h2>${title}</h2>

    ${body}

    <div class="modalActions">

      <button
        class="secondary"
        onclick="closeModal()">
        Fechar
      </button>

    </div>

  `;

  document.getElementById(
    "overlay"
  ).style.display="flex";

}

function closeModal(){

  document.getElementById(
    "overlay"
  ).style.display="none";

}

function openLogin(){

  const currentUser=
    localStorage.getItem(
      CURRENT_KEY
    );

  if(currentUser){

    openModal(

      "👤 Conta",

      `

      <p>
        Estás ligado como
        <strong>
          ${esc(currentUser)}
        </strong>.
      </p>

      <button
        class="primary"
        onclick="logout()">
        Terminar sessão
      </button>

      `

    );

    return;

  }

  openModal(

    "🔐 Entrar no IternetWorld",

    `

    <input
      id="loginUser"
      placeholder="Nome de utilizador">

    <input
      id="loginPass"
      type="password"
      placeholder="Palavra-passe">

    <div class="modalActions">

      <button
        class="primary"
        onclick="login()">
        Entrar
      </button>

      <button
        class="secondary"
        onclick="register()">
        Criar conta
      </button>

    </div>

    <p class="small">
      O login é opcional.
      O navegador funciona sem conta.
    </p>

    `

  );

}

function getUsers(){

  return JSON.parse(
    localStorage.getItem(
      USERS_KEY
    )||"[]"
  );

}

function register(){

  const u=
    document.getElementById(
      "loginUser"
    ).value.trim();

  const p=
    document.getElementById(
      "loginPass"
    ).value;

  if(!u||!p){

    alert(
      "Preenche o utilizador e a palavra-passe."
    );

    return;

  }

  const users=getUsers();

  if(
    users.some(
      x=>x.user.toLowerCase()===u.toLowerCase()
    )
  ){

    alert(
      "Esse utilizador já existe."
    );

    return;

  }

  users.push({
    user:u,
    pass:p
  });

  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(users)
  );

  localStorage.setItem(
    CURRENT_KEY,
    u
  );

  updateLoginButton();

  closeModal();

  alert(
    "Conta criada."
  );

}

function login(){

  const u=
    document.getElementById(
      "loginUser"
    ).value.trim();

  const p=
    document.getElementById(
      "loginPass"
    ).value;

  const user=
    getUsers().find(
      x=>x.user===u && x.pass===p
    );

  if(!user){

    alert(
      "Utilizador ou palavra-passe incorretos."
    );

    return;

  }

  localStorage.setItem(
    CURRENT_KEY,
    u
  );

  updateLoginButton();

  closeModal();

}

function logout(){

  localStorage.removeItem(
    CURRENT_KEY
  );

  updateLoginButton();

  closeModal();

}

function updateLoginButton(){

  const u=
    localStorage.getItem(
      CURRENT_KEY
    );

  document.getElementById(
    "loginButton"
  ).textContent=
    u
      ?("👤 "+u)
      :"Entrar";

}

document.addEventListener(
  "click",
  e=>{

    const m=
      document.getElementById("menu");

    const btn=
      e.target.closest(
        'button[title="Menu"]'
      );

    if(
      !m.contains(e.target) &&
      !btn
    ){

      closeMenu();

    }

  }
);

updateLoginButton();

createTab();

</script>

</body>
</html>
