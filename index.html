<!DOCTYPE html>

<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IternetWorld</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1120;
    color:white;
    overflow:hidden;
}

/* ABAS */
#tabs{
    height:42px;
    background:#111a2b;
    display:flex;
    align-items:center;
    gap:5px;
    padding:5px 8px 0;
    border-bottom:1px solid #2c3a52;
}

.tab{
    height:37px;
    min-width:150px;
    max-width:230px;
    background:#182338;
    color:#94a3b8;
    border:1px solid #2c3a52;
    border-bottom:0;
    border-radius:9px 9px 0 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    cursor:pointer;
}

.tab.active{
    background:#0b1120;
    color:white;
}

.tab-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.tab-close{
    margin-left:12px;
    cursor:pointer;
}

.new-tab{
    width:36px;
    height:36px;
    border:0;
    background:transparent;
    color:white;
    font-size:24px;
    cursor:pointer;
}

/* BARRA */
.toolbar{
    height:58px;
    background:#111a2b;
    border-bottom:1px solid #2c3a52;
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 10px;
}

.tool{
    width:38px;
    height:38px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:white;
    font-size:19px;
    cursor:pointer;
}

.tool:hover{
    background:#182338;
}

.address{
    flex:1;
    height:40px;
    display:flex;
    background:#182338;
    border:1px solid #2c3a52;
    border-radius:9px;
    overflow:hidden;
}

.address input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:0 14px;
    font-size:14px;
}

.address button{
    border:0;
    background:#2563eb;
    color:white;
    padding:0 20px;
    cursor:pointer;
}

/* PÁGINA */
#page{
    height:calc(100vh - 100px);
    background:#0b1120;
    overflow:auto;
}

/* PÁGINA INICIAL */
.home{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.logo{
    font-size:58px;
    font-weight:bold;
    letter-spacing:-3px;
}

.logo span{
    color:#2563eb;
}

.subtitle{
    color:#94a3b8;
    margin-top:8px;
    margin-bottom:28px;
}

.search{
    width:min(700px,90%);
    height:54px;
    display:flex;
    background:#182338;
    border:1px solid #2c3a52;
    border-radius:12px;
    overflow:hidden;
}

.search input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:0 18px;
    font-size:16px;
}

.search button{
    border:0;
    background:#2563eb;
    color:white;
    padding:0 25px;
    cursor:pointer;
}

.shortcuts{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.shortcuts button{
    border:1px solid #2c3a52;
    background:#182338;
    color:white;
    border-radius:9px;
    padding:11px 17px;
    cursor:pointer;
}

.shortcuts button:hover{
    border-color:#2563eb;
}

.info{
    color:#64748b;
    margin-top:28px;
    font-size:13px;
}

/* SITE */
.site{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.site-bar{
    height:40px;
    background:#182338;
    border-bottom:1px solid #2c3a52;
    color:#94a3b8;
    display:flex;
    align-items:center;
    padding:0 14px;
    font-size:13px;
}

.site iframe{
    flex:1;
    width:100%;
    border:0;
    background:white;
}

/* MENU */
#menu{
    position:fixed;
    right:12px;
    top:108px;
    width:250px;
    background:#182338;
    border:1px solid #2c3a52;
    border-radius:12px;
    padding:8px;
    display:none;
    z-index:20;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

#menu.show{
    display:block;
}

.menu-button{
    width:100%;
    border:0;
    background:transparent;
    color:white;
    text-align:left;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
}

.menu-button:hover{
    background:#0b1120;
}

/* MODAL */
#modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
}

#modal.show{
    display:flex;
}

.modal-box{
    width:min(500px,90%);
    max-height:80vh;
    overflow:auto;
    background:#182338;
    border:1px solid #2c3a52;
    border-radius:14px;
    padding:22px;
}

.modal-box h2{
    margin-bottom:15px;
}

.close{
    float:right;
    border:0;
    background:transparent;
    color:white;
    font-size:22px;
    cursor:pointer;
}

@media(max-width:700px){

    .tab{
        min-width:110px;
    }

    .logo{
        font-size:42px;
    }

    .toolbar{
        gap:3px;
    }

    .tool{
        width:32px;
    }
}
</style>

</head>

<body>

<!-- ABAS -->

<div id="tabs"></div>

<!-- BARRA -->

<div class="toolbar">


<button class="tool" onclick="back()">←</button>
<button class="tool" onclick="forward()">→</button>
<button class="tool" onclick="reload()">↻</button>
<button class="tool" onclick="home()">⌂</button>

<form class="address" onsubmit="navigate(event)">
    <input id="address"
           placeholder="Pesquisar ou escrever um endereço">
    <button type="submit">Ir</button>
</form>

<button class="tool" onclick="favorite()">★</button>
<button class="tool" onclick="menu()">☰</button>
```

</div>

<!-- PÁGINA -->

<div id="page"></div>

<!-- MENU -->

<div id="menu">

```
<button class="menu-button" onclick="ai()">
    🤖 IternetWorld AI
</button>

<button class="menu-button" onclick="favorites()">
    ⭐ Favoritos
</button>

<button class="menu-button" onclick="historyPage()">
    🕘 Histórico
</button>

<button class="menu-button" onclick="downloads()">
    ⬇ Downloads
</button>

<button class="menu-button" onclick="settings()">
    ⚙ Configurações
</button>

<button class="menu-button" onclick="theme()">
    🌙 Modo escuro/claro
</button>
```

</div>

<!-- MODAL -->

<div id="modal">
    <div class="modal-box">
        <button class="close" onclick="closeModal()">×</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>

/* =========================
   ESTADO
========================= */

let tabs=[];
let active=0;

let favs=JSON.parse(
    localStorage.getItem("iw_favorites") || "[]"
);

let visits=JSON.parse(
    localStorage.getItem("iw_history") || "[]"
);


/* =========================
   ABAS
========================= */

function createTab(){

    tabs.push({
        title:"Nova aba",
        url:""
    });

    active=tabs.length-1;

    drawTabs();
    home();
}

function drawTabs(){

    const tabsBox=document.getElementById("tabs");

    tabsBox.innerHTML="";

    tabs.forEach((tab,index)=>{

        const div=document.createElement("div");

        div.className=
            "tab"+
            (index===active ? " active" : "");

        div.innerHTML=`
            <span class="tab-name">
                ${escapeHTML(tab.title)}
            </span>

            <span class="tab-close"
                  onclick="event.stopPropagation();closeTab(${index})">
                ×
            </span>
        `;

        div.onclick=()=>{
            active=index;
            drawTabs();
            showCurrent();
        };

        tabsBox.appendChild(div);
    });

    const plus=document.createElement("button");

    plus.className="new-tab";
    plus.textContent="+";

    plus.onclick=createTab;

    tabsBox.appendChild(plus);
}

function closeTab(index){

    tabs.splice(index,1);

    if(tabs.length===0){
        createTab();
        return;
    }

    if(active>=tabs.length){
        active=tabs.length-1;
    }

    drawTabs();
    showCurrent();
}

function showCurrent(){

    if(tabs[active].url){
        openSite(tabs[active].url,false);
    }else{
        home();
    }
}


/* =========================
   INÍCIO
========================= */

function home(){

    tabs[active].title="Nova aba";
    tabs[active].url="";

    document.getElementById("address").value="";

    drawTabs();

    document.getElementById("page").innerHTML=`

        <div class="home">

            <div class="logo">
                Iternet<span>World</span>
            </div>

            <div class="subtitle">
                Pesquisa e navegação num só lugar.
            </div>

            <form class="search"
                  onsubmit="homeSearch(event)">

                <input id="homeSearch"
                       placeholder="Pesquisar ou escrever um endereço"
                       autocomplete="off">

                <button>
                    Pesquisar
                </button>

            </form>

            <div class="shortcuts">

                <button onclick="openSite('https://www.youtube.com/')">
                    ▶ YouTube
                </button>

                <button onclick="openSite('https://www.google.com/')">
                    Google
                </button>

                <button onclick="openSite('https://github.com/')">
                    GitHub
                </button>

                <button onclick="openSite('https://www.minecraft.net/')">
                    Minecraft
                </button>

                <button onclick="ai()">
                    🤖 IternetWorld AI
                </button>

            </div>

            <div class="info">
                O IternetWorld tem abas, favoritos, histórico,
                modo escuro e muito mais.
            </div>

        </div>
    `;
}

function homeSearch(event){

    event.preventDefault();

    const value=
        document.getElementById("homeSearch")
        .value
        .trim();

    if(!value)return;

    navigateValue(value);
}


/* =========================
   NAVEGAÇÃO
========================= */

function navigate(event){

    event.preventDefault();

    const value=
        document.getElementById("address")
        .value
        .trim();

    if(!value)return;

    navigateValue(value);
}

function navigateValue(value){

    if(
        value.startsWith("http://") ||
        value.startsWith("https://") ||
        /^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/.test(value)
    ){

        let url=value;

        if(!url.startsWith("http")){
            url="https://"+url;
        }

        openSite(url);

    }else{

        search(value);
    }
}

function search(text){

    const url=
        "https://www.google.com/search?q="+
        encodeURIComponent(text);

    openSite(url);

}


/* =========================
   ABRIR SITE
========================= */

function openSite(url,record=true){

    tabs[active].url=url;

    try{

        const u=new URL(url);

        tabs[active].title=
            u.hostname.replace(/^www\./,"");

        document.getElementById("address").value=url;

        if(record){

            visits.unshift({
                title:tabs[active].title,
                url:url,
                time:new Date().toLocaleString("pt-PT")
            });

            visits=visits.slice(0,300);

            localStorage.setItem(
                "iw_history",
                JSON.stringify(visits)
            );
        }

        drawTabs();

        document.getElementById("page").innerHTML=`

            <div class="site">

                <div class="site-bar">
                    🌐 ${escapeHTML(tabs[active].title)}
                </div>

                <iframe
                    src="${escapeHTML(url)}"
                    allow="fullscreen; autoplay; encrypted-media; picture-in-picture">
                </iframe>

            </div>
        `;

    }catch(error){

        search(url);
    }
}


/* =========================
   BOTÕES
========================= */

function back(){

    const frame=document.querySelector(".site iframe");

    if(frame){

        try{
            frame.contentWindow.history.back();
        }catch(e){}
    }
}

function forward(){

    const frame=document.querySelector(".site iframe");

    if(frame){

        try{
            frame.contentWindow.history.forward();
        }catch(e){}
    }
}

function reload(){

    const frame=document.querySelector(".site iframe");

    if(frame){
        frame.src=frame.src;
    }else{
        home();
    }
}


/* =========================
   FAVORITOS
========================= */

function favorite(){

    const tab=tabs[active];

    if(!tab.url){

        alert("Abre primeiro um site.");

        return;
    }

    if(!favs.some(x=>x.url===tab.url)){

        favs.push({
            title:tab.title,
            url:tab.url
        });

        localStorage.setItem(
            "iw_favorites",
            JSON.stringify(favs)
        );

        alert("Adicionado aos favoritos!");

    }else{

        alert("Este site já está nos favoritos.");
    }
}


/* =========================
   MENU
========================= */

function menu(){

    document
        .getElementById("menu")
        .classList.toggle("show");
}


/* =========================
   MODAL
========================= */

function showModal(content){

    document
        .getElementById("modalContent")
        .innerHTML=content;

    document
        .getElementById("modal")
        .classList.add("show");
}

function closeModal(){

    document
        .getElementById("modal")
        .classList.remove("show");
}


/* =========================
   FAVORITOS
========================= */

function favorites(){

    document
        .getElementById("menu")
        .classList.remove("show");

    let html="<h2>⭐ Favoritos</h2>";

    if(favs.length===0){

        html+=`
            <p style="color:#94a3b8">
                Ainda não tens favoritos.
            </p>
        `;

    }else{

        favs.forEach(item=>{

            html+=`
                <p style="
                    padding:12px;
                    border-bottom:1px solid #2c3a52;
                ">

                    <a href="#"
                       style="color:#60a5fa"
                       onclick="
                           event.preventDefault();
                           closeModal();
                           openSite('${escapeHTML(item.url)}');
                       ">

                        ${escapeHTML(item.title)}

                    </a>

                    <br>

                    <small style="color:#94a3b8">
                        ${escapeHTML(item.url)}
                    </small>

                </p>
            `;
        });
    }

    showModal(html);
}


/* =========================
   HISTÓRICO
========================= */

function historyPage(){

    document
        .getElementById("menu")
        .classList.remove("show");

    let html="<h2>🕘 Histórico</h2>";

    if(visits.length===0){

        html+=`
            <p style="color:#94a3b8">
                O histórico está vazio.
            </p>
        `;

    }else{

        visits.forEach(item=>{

            html+=`
                <p style="
                    padding:12px;
                    border-bottom:1px solid #2c3a52;
                ">

                    <b>${escapeHTML(item.title)}</b>

                    <br>

                    <small style="color:#94a3b8">
                        ${escapeHTML(item.url)}
                    </small>

                    <br>

                    <small style="color:#64748b">
                        ${escapeHTML(item.time)}
                    </small>

                </p>
            `;
        });
    }

    showModal(html);
}


/* =========================
   DOWNLOAD
========================= */

function downloads(){

    document
        .getElementById("menu")
        .classList.remove("show");

    showModal(`

        <h2>⬇ Downloads</h2>

        <p style="color:#94a3b8">
            Descarrega o IternetWorld para Windows.
        </p>

        <br>

        <a
            href="https://github.com/JogosWorld/InternetWorld/releases/download/v1.0.0/IternetWorld.Setup.1.0.0.exe"
            style="
                display:inline-block;
                padding:13px 20px;
                background:#2563eb;
                color:white;
                text-decoration:none;
                border-radius:8px;
            "
        >
            ⬇ Download IternetWorld
        </a>

    `);
}


/* =========================
   CONFIGURAÇÕES
========================= */

function settings(){

    document
        .getElementById("menu")
        .classList.remove("show");

    showModal(`

        <h2>⚙ Configurações</h2>

        <p style="color:#94a3b8">
            Personalização do IternetWorld.
        </p>

        <br>

        <button
            onclick="theme();closeModal()"
            style="
                width:100%;
                padding:13px;
                border:0;
                border-radius:8px;
                background:#2563eb;
                color:white;
                cursor:pointer;
            "
        >
            🌙 Alterar tema
        </button>

    `);
}


/* =========================
   TEMA
========================= */

function theme(){

    document.body.classList.toggle("light");

    if(document.body.classList.contains("light")){

        document.body.style.background="#eef2f7";

        localStorage.setItem(
            "iw_theme",
            "light"
        );

    }else{

        document.body.style.background="#0b1120";

        localStorage.setItem(
            "iw_theme",
            "dark"
        );
    }
}


/* =========================
   AI
========================= */

function ai(){

    document
        .getElementById("menu")
        .classList.remove("show");

    showModal(`

        <h2>🤖 IternetWorld AI</h2>

        <p style="color:#94a3b8">
            Escreve uma pergunta.
        </p>

        <br>

        <input
            id="aiInput"
            placeholder="Pergunta alguma coisa..."
            style="
                width:100%;
                height:44px;
                padding:10px;
                border-radius:8px;
                border:1px solid #2c3a52;
                background:#0b1120;
                color:white;
            "
            onkeydown="
                if(event.key==='Enter')askAI()
            "
        >

        <button
            onclick="askAI()"
            style="
                width:100%;
                margin-top:10px;
                height:42px;
                border:0;
                border-radius:8px;
                background:#2563eb;
                color:white;
                cursor:pointer;
            "
        >
            Perguntar
        </button>

        <div id="aiAnswer"
             style="
                 margin-top:18px;
                 color:#94a3b8;
             ">
        </div>

    `);
}

function askAI(){

    const input=document.getElementById("aiInput");

    if(!input || !input.value.trim())return;

    document.getElementById("aiAnswer").innerHTML=
        "Pergunta recebida: <b>"+
        escapeHTML(input.value)+
        "</b><br><br>"+
        "O IternetWorld AI pode ser ligado a uma API de IA.";
}


/* =========================
   SEGURANÇA HTML
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   INICIAR
========================= */

createTab();

</script>

</body>
</html>
