<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IternetWorld</title>

<style>
:root{
  --bg:#0f172a;
  --bar:#172033;
  --card:#1e293b;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:#334155;
  --blue:#2563eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

body.light{
  --bg:#f1f5f9;
  --bar:#ffffff;
  --card:#ffffff;
  --text:#172033;
  --muted:#64748b;
  --line:#cbd5e1;
}

header{
  background:var(--bar);
  border-bottom:1px solid var(--line);
}

.tabs{
  height:42px;
  display:flex;
  gap:5px;
  align-items:end;
  padding:5px 8px 0;
  overflow-x:auto;
}

.tab{
  height:37px;
  min-width:145px;
  max-width:230px;
  padding:0 9px;
  display:flex;
  align-items:center;
  gap:7px;
  background:#253147;
  color:var(--muted);
  border-radius:9px 9px 0 0;
  cursor:pointer;
}

.light .tab{
  background:#e2e8f0;
}

.tab.active{
  background:var(--card);
  color:var(--text);
}

.tab span{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.tab button{
  background:none;
  border:0;
  color:inherit;
  font-size:17px;
  cursor:pointer;
}

.add{
  height:34px;
  border:0;
  background:none;
  color:var(--text);
  font-size:25px;
  cursor:pointer;
}

.toolbar{
  height:65px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
}

.tool{
  width:39px;
  height:39px;
  border:0;
  border-radius:9px;
  background:var(--card);
  color:var(--text);
  font-size:19px;
  cursor:pointer;
}

.address{
  height:42px;
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
  background:#f8fafc;
  border-radius:22px;
  padding-left:14px;
}

.address input{
  border:0;
  outline:0;
  background:transparent;
  color:#172033;
  font-size:15px;
  flex:1;
}

.address button{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:18px;
  padding:8px 15px;
  margin-right:5px;
  cursor:pointer;
}

.page{
  height:calc(100vh - 107px);
  overflow:auto;
}

.home{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.content{
  width:min(720px,92%);
}

.logo{
  font-size:64px;
  font-weight:800;
  letter-spacing:-4px;
}

.subtitle{
  color:var(--muted);
  font-size:17px;
  margin:8px 0 28px;
}

.search{
  display:flex;
  background:white;
  border-radius:28px;
  padding:5px;
  box-shadow:0 8px 30px #0002;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  padding:13px 17px;
  font-size:16px;
}

.search button{
  border:0;
  border-radius:23px;
  background:var(--blue);
  color:white;
  padding:0 20px;
  cursor:pointer;
}

.shortcuts{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

.shortcut{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
}

.menu{
  position:absolute;
  z-index:10;
  right:10px;
  top:104px;
  width:205px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px;
  box-shadow:0 15px 40px #0008;
}

.menu button{
  width:100%;
  padding:12px;
  border:0;
  background:none;
  color:var(--text);
  text-align:left;
  border-radius:8px;
  cursor:pointer;
}

.menu button:hover{
  background:#64748b33;
}

.hidden{
  display:none!important;
}

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  width:min(720px,92%);
  max-height:78vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.head button{
  border:0;
  background:none;
  color:var(--text);
  font-size:28px;
  cursor:pointer;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.item a{
  color:#60a5fa;
  text-decoration:none;
  flex:1;
}

.item small{
  color:var(--muted);
}

.item button,
.clear{
  border:0;
  background:#475569;
  color:white;
  border-radius:7px;
  padding:7px 10px;
  cursor:pointer;
}

.notice{
  margin-top:22px;
  color:var(--muted);
  font-size:13px;
}
</style>
</head>

<body>

<header>

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">

    <button class="tool" onclick="goBack()">←</button>

    <button class="tool" onclick="goForward()">→</button>

    <button class="tool" onclick="reloadPage()">↻</button>

    <button class="tool" onclick="goHome()">⌂</button>

    <form class="address" onsubmit="navigate(event)">

      <span>🔒</span>

      <input
        id="address"
        placeholder="Pesquisar ou escrever um endereço"
        autocomplete="off"
      >

      <button>Ir</button>

    </form>

    <button
      class="tool"
      onclick="addFavorite()"
      title="Favorito"
    >
      ☆
    </button>

    <button
      class="tool"
      onclick="toggleMenu()"
    >
      ☰
    </button>

  </div>

</header>

<div id="menu" class="menu hidden">

  <button onclick="showFavorites()">
    ⭐ Favoritos
  </button>

  <button onclick="showHistory()">
    🕘 Histórico
  </button>

  <button onclick="toggleDarkMode()">
    🌙 Modo escuro/claro
  </button>

</div>

<main
  class="page"
  id="page"
></main>

<div
  id="modal"
  class="modal hidden"
>

  <div class="box">

    <div class="head">

      <h2 id="modalTitle">
        IternetWorld
      </h2>

      <button onclick="closeModal()">
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>

<script>

let tabs = [];

let activeTab = 0;

let historyList =
  JSON.parse(
    localStorage.getItem(
      "iw_history"
    ) || "[]"
  );

let favorites =
  JSON.parse(
    localStorage.getItem(
      "iw_favorites"
    ) || "[]"
  );


function saveData(){

  localStorage.setItem(
    "iw_history",
    JSON.stringify(historyList)
  );

  localStorage.setItem(
    "iw_favorites",
    JSON.stringify(favorites)
  );

}


function escapeHTML(text){

  return String(text || "")
    .replace(
      /[&<>"']/g,
      character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[character])
    );

}


function makeURL(value){

  value = value.trim();

  if(!value){
    return "";
  }

  if(
    /^https?:\/\//i.test(value)
  ){

    return value;

  }

  if(
    /^[\w.-]+\.[a-z]{2,}(\/.*)?$/i
      .test(value)
  ){

    return "https://" + value;

  }

  return (
    "https://www.google.com/search?q=" +
    encodeURIComponent(value)
  );

}


function renderTabs(){

  const container =
    document.getElementById(
      "tabs"
    );

  container.innerHTML = "";

  tabs.forEach(
    (tab,index) => {

      const element =
        document.createElement(
          "div"
        );

      element.className =
        "tab " +
        (
          index === activeTab
            ? "active"
            : ""
        );

      element.innerHTML = `

        <span>
          ${escapeHTML(tab.title)}
        </span>

        <button>
          ×
        </button>

      `;

      element.onclick =
        event => {

          if(
            event.target.tagName ===
            "BUTTON"
          ){

            closeTab(index);

            return;
          }

          activeTab = index;

          renderTabs();

          showTab();

        };

      container.appendChild(
        element
      );

    }
  );


  const newButton =
    document.createElement(
      "button"
    );

  newButton.className = "add";

  newButton.textContent = "+";

  newButton.onclick =
    () => createTab();

  container.appendChild(
    newButton
  );

}


function createTab(url=""){

  tabs.push({

    title:"Nova aba",

    url:""

  });

  activeTab =
    tabs.length - 1;

  renderTabs();

  if(url){

    openURL(url);

  }else{

    goHome();

  }

}


function closeTab(index){

  tabs.splice(
    index,
    1
  );

  if(
    tabs.length === 0
  ){

    createTab();

    return;

  }

  if(
    activeTab >= tabs.length
  ){

    activeTab =
      tabs.length - 1;

  }

  renderTabs();

  showTab();

}


function showTab(){

  const tab =
    tabs[activeTab];

  if(!tab){

    return;

  }

  if(tab.url){

    document.getElementById(
      "address"
    ).value =
      tab.url;

  }else{

    goHome();

  }

}


function openURL(url){

  const tab =
    tabs[activeTab];

  if(!tab){

    return;

  }

  tab.url = url;

  tab.title =
    url
      .replace(
        /^https?:\/\//i,
        ""
      )
      .split("/")[0] ||
    "Página";

  document.getElementById(
    "address"
  ).value = url;

  renderTabs();


  historyList.unshift({

    title:tab.title,

    url:url,

    time:Date.now()

  });


  historyList =
    historyList.slice(
      0,
      300
    );

  saveData();


  /*
    O GitHub Pages não permite
    transformar este HTML num
    navegador de sistema.

    Por isso os sites externos
    são abertos numa nova aba.
  */

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


function navigate(event){

  event.preventDefault();

  const value =
    document.getElementById(
      "address"
    ).value;

  const url =
    makeURL(value);

  if(url){

    openURL(url);

  }

}


function homeSearch(event){

  event.preventDefault();

  const value =
    document.getElementById(
      "homeInput"
    ).value;

  const url =
    makeURL(value);

  if(url){

    openURL(url);

  }

}


function goHome(){

  const tab =
    tabs[activeTab];

  if(tab){

    tab.url = "";

    tab.title =
      "Nova aba";

  }

  document.getElementById(
    "address"
  ).value = "";

  renderTabs();


  document.getElementById(
    "page"
  ).innerHTML = `

    <section class="home">

      <div class="content">

        <div class="logo">
          IternetWorld
        </div>

        <div class="subtitle">
          O teu navegador web simples,
          moderno e personalizável.
        </div>

        <form
          class="search"
          onsubmit="homeSearch(event)"
        >

          <input
            id="homeInput"
            placeholder="Pesquisar na internet..."
          >

          <button>
            Pesquisar
          </button>

        </form>

        <div class="shortcuts">

          <button
            class="shortcut"
            onclick="openURL(
              'https://www.google.com'
            )"
          >
            Google
          </button>

          <button
            class="shortcut"
            onclick="openURL(
              'https://www.youtube.com'
            )"
          >
            YouTube
          </button>

          <button
            class="shortcut"
            onclick="openURL(
              'https://www.wikipedia.org'
            )"
          >
            Wikipedia
          </button>

          <button
            class="shortcut"
            onclick="openURL(
              'https://github.com'
            )"
          >
            GitHub
          </button>

        </div>

        <div class="notice">

          Os sites externos são abertos
          numa nova aba.

        </div>

      </div>

    </section>

  `;

}


function goBack(){

  history.back();

}


function goForward(){

  history.forward();

}


function reloadPage(){

  location.reload();

}


function addFavorite(){

  const tab =
    tabs[activeTab];

  if(
    !tab ||
    !tab.url
  ){

    alert(
      "Abre um site primeiro."
    );

    return;

  }


  if(
    !favorites.some(
      item =>
        item.url === tab.url
    )
  ){

    favorites.unshift({

      title:tab.title,

      url:tab.url

    });

    saveData();

    alert(
      "⭐ Adicionado aos favoritos!"
    );

  }else{

    alert(
      "Este site já está nos favoritos."
    );

  }

}


function toggleMenu(){

  document.getElementById(
    "menu"
  ).classList.toggle(
    "hidden"
  );

}


function toggleDarkMode(){

  document.body.classList.toggle(
    "light"
  );

  localStorage.setItem(
    "iw_theme",
    document.body.classList.contains(
      "light"
    )
      ? "light"
      : "dark"
  );

  toggleMenu();

}


function openModal(
  title,
  content
){

  document.getElementById(
    "modalTitle"
  ).textContent =
    title;

  document.getElementById(
    "modalContent"
  ).innerHTML =
    content;

  document.getElementById(
    "modal"
  ).classList.remove(
    "hidden"
  );

}


function closeModal(){

  document.getElementById(
    "modal"
  ).classList.add(
    "hidden"
  );

}


function showFavorites(){

  toggleMenu();


  const content =
    favorites.length

      ?

        favorites
          .map(
            (item,index) => `

              <div class="item">

                <a
                  href="#"
                  onclick="
                    openFavorite(${index})
                  "
                >
                  ${escapeHTML(
                    item.title
                  )}
                </a>

                <button
                  onclick="
                    removeFavorite(${index})
                  "
                >
                  ×
                </button>

              </div>

            `
          )
          .join("")

      :

        "<p>Nenhum favorito ainda.</p>";


  openModal(
    "⭐ Favoritos",
    content
  );

}


function openFavorite(index){

  const item =
    favorites[index];

  closeModal();

  openURL(
    item.url
  );

}


function removeFavorite(index){

  favorites.splice(
    index,
    1
  );

  saveData();

  showFavorites();

}


function showHistory(){

  toggleMenu();


  let content = "";


  if(historyList.length){

    content = `

      <button
        class="clear"
        onclick="clearHistory()"
      >
        Limpar histórico
      </button>

    `;


    content +=
      historyList
        .map(
          (item,index) => `

            <div class="item">

              <a
                href="#"
                onclick="
                  openHistory(${index})
                "
              >
                ${escapeHTML(
                  item.title
                )}
              </a>

              <small>
                ${new Date(
                  item.time
                ).toLocaleString()}
              </small>

            </div>

          `
        )
        .join("");

  }else{

    content =
      "<p>Nenhum histórico.</p>";

  }


  openModal(
    "🕘 Histórico",
    content
  );

}


function openHistory(index){

  const item =
    historyList[index];

  closeModal();

  openURL(
    item.url
  );

}


function clearHistory(){

  historyList = [];

  saveData();

  showHistory();

}


if(
  localStorage.getItem(
    "iw_theme"
  ) === "light"
){

  document.body.classList.add(
    "light"
  );

}


createTab();

</script>

</body>
</html>
