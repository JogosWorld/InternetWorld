<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IternetWorld</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

/* =========================
   TEMAS
========================= */

:root{
    --fundo:#151515;
    --barra:#1e1e1e;
    --botao:#303030;
    --texto:#ffffff;
    --azul:#00bfff;
    --pagina:#ffffff;
    --textoPagina:#222222;
    --cartao:#f4f4f4;
}

body.claro{
    --fundo:#eeeeee;
    --barra:#f5f5f5;
    --botao:#dddddd;
    --texto:#111111;
    --pagina:#ffffff;
    --textoPagina:#222222;
    --cartao:#f1f1f1;
}

body.verde{
    --azul:#20d070;
}

body.roxo{
    --azul:#a855f7;
}

body.vermelho{
    --azul:#ff4444;
}

/* =========================
   BROWSER
========================= */

.browser{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--fundo);
}

/* =========================
   ABAS
========================= */

.tabs{
    height:60px;
    display:flex;
    align-items:end;
    padding:0 10px;
    gap:5px;
    background:#171717;
    flex-shrink:0;
}

.tab{
    height:44px;
    min-width:180px;
    max-width:280px;
    background:#292929;
    color:#fff;
    border-radius:12px 12px 0 0;
    display:flex;
    align-items:center;
    padding:0 13px;
    cursor:pointer;
    gap:9px;
    user-select:none;
}

.tab.active{
    background:#3c3c3c;
}

.tab-title{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.close-tab{
    font-weight:bold;
    font-size:17px;
}

.new-tab{
    color:#fff;
    font-size:28px;
    padding:0 12px 7px;
    cursor:pointer;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    height:58px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    background:var(--barra);
    flex-shrink:0;
}

.logo{
    color:var(--azul);
    font-size:20px;
    font-weight:bold;
    white-space:nowrap;
    margin-right:3px;
}

.toolbar button{
    border:0;
    background:var(--botao);
    color:var(--texto);
    height:40px;
    min-width:42px;
    border-radius:11px;
    font-size:18px;
    cursor:pointer;
}

.toolbar button:hover{
    filter:brightness(1.2);
}

.address{
    flex:1;
    height:40px;
    border:none;
    outline:none;
    border-radius:22px;
    background:#303030;
    color:#fff;
    padding:0 18px;
    font-size:15px;
}

.go{
    padding:0 18px;
}

/* =========================
   PERSONALIZAÇÃO
========================= */

.custom-box{
    position:relative;
}

.custom-menu{
    display:none;
    position:absolute;
    right:0;
    top:48px;
    width:240px;
    background:#252525;
    border-radius:14px;
    padding:15px;
    box-shadow:0 10px 35px #0009;
    z-index:99999;
}

.custom-menu.show{
    display:block;
}

.custom-menu h3{
    margin:0 0 12px;
    color:#fff;
}

.custom-menu button{
    width:100%;
    margin:4px 0;
    height:38px;
    text-align:left;
    padding-left:12px;
}

/* =========================
   PÁGINAS
========================= */

.pages{
    flex:1;
    position:relative;
    background:var(--pagina);
    min-height:0;
}

.page{
    position:absolute;
    inset:0;
    display:none;
    background:var(--pagina);
    overflow:hidden;
}

.page.active{
    display:block;
}

/* =========================
   HOME
========================= */

.home{
    width:100%;
    height:100%;
    overflow:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:70px;
    background:var(--pagina);
    color:var(--textoPagina);
}

.home h1{
    font-size:46px;
    margin:10px;
    color:var(--azul);
}

.home p{
    color:#666;
}

.search-box{
    width:min(720px,85%);
    height:55px;
    border:2px solid #ddd;
    border-radius:30px;
    display:flex;
    align-items:center;
    padding:5px 8px 5px 20px;
    margin-top:20px;
    background:white;
}

.search-box input{
    flex:1;
    height:100%;
    border:none;
    outline:none;
    font-size:18px;
    color:#222;
}

.search-box button{
    height:43px;
    width:43px;
    border:none;
    border-radius:50%;
    background:var(--azul);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.shortcuts{
    display:flex;
    gap:15px;
    margin-top:35px;
    flex-wrap:wrap;
    justify-content:center;
}

.shortcut{
    width:140px;
    padding:18px;
    border-radius:14px;
    background:var(--cartao);
    text-align:center;
    cursor:pointer;
    color:#222;
    font-size:16px;
}

.shortcut:hover{
    transform:translateY(-2px);
    background:#ddd;
}

/* =========================
   RESULTADOS
========================= */

.search-page{
    width:100%;
    height:100%;
    overflow:auto;
    background:white;
    color:#222;
}

.search-header{
    position:sticky;
    top:0;
    z-index:20;
    background:white;
    border-bottom:1px solid #ddd;
    padding:22px 7%;
}

.search-bar{
    width:min(800px,100%);
    height:52px;
    border:1px solid #ccc;
    border-radius:28px;
    display:flex;
    align-items:center;
    overflow:hidden;
    margin:auto;
}

.search-bar input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    padding:0 20px;
    font-size:17px;
}

.search-bar button{
    width:55px;
    height:100%;
    border:0;
    background:var(--azul);
    color:white;
    font-size:21px;
    cursor:pointer;
}

.results-container{
    width:min(900px,88%);
    margin:0 auto;
    padding:20px 0 60px;
}

.results-info{
    color:#555;
    padding:5px 0 15px;
    border-bottom:1px solid #ddd;
}

.result{
    padding:22px 8px;
    border-bottom:1px solid #eee;
}

.result:hover{
    background:#fafafa;
}

.result h2{
    margin:0 0 7px;
    font-size:20px;
    font-weight:500;
}

.result h2 a{
    color:#0758c9;
    text-decoration:none;
}

.result h2 a:hover{
    text-decoration:underline;
}

.result-url{
    color:#16833b;
    font-size:14px;
    margin-bottom:7px;
    word-break:break-all;
}

.result-description{
    color:#444;
    line-height:1.5;
}

.no-results{
    margin:70px auto;
    max-width:700px;
    padding:45px;
    background:#f4f4f4;
    border-radius:18px;
    text-align:center;
}

.no-results h2{
    color:#e33;
}

/* =========================
   WEBVIEW
========================= */

.webview-container{
    position:absolute;
    inset:0;
    background:white;
}

webview{
    width:100%;
    height:100%;
    border:0;
}

/* =========================
   LOADING
========================= */

.loading{
    padding:45px;
    text-align:center;
    color:#555;
    font-size:18px;
}

/* =========================
   DARK SEARCH
========================= */

body:not(.claro) .search-page{
    background:#fff;
}

</style>
</head>

<body>

<div class="browser">

    <!-- =====================
         ABAS
    ====================== -->

    <div class="tabs" id="tabs"></div>


    <!-- =====================
         BARRA
    ====================== -->

    <div class="toolbar">

        <div class="logo">
            🌐 IternetWorld
        </div>

        <button onclick="goBack()" title="Voltar">
            ←
        </button>

        <button onclick="goForward()" title="Avançar">
            →
        </button>

        <button onclick="goHome()" title="Página inicial">
            🏠
        </button>

        <button onclick="reloadPage()" title="Atualizar">
            ↻
        </button>

        <input
            id="address"
            class="address"
            type="text"
            placeholder="Pesquisar ou escrever um endereço"
            onkeydown="addressKey(event)"
        >

        <button class="go" onclick="goAddress()">
            Ir
        </button>

        <div class="custom-box">

            <button
                onclick="toggleCustomization()"
                title="Personalizar"
            >
                🎨
            </button>

            <div
                class="custom-menu"
                id="customMenu"
            >

                <h3>🎨 Personalizar</h3>

                <button onclick="setTheme('escuro')">
                    🌙 Modo escuro
                </button>

                <button onclick="setTheme('claro')">
                    ☀️ Modo claro
                </button>

                <button onclick="setTheme('azul')">
                    🔵 Azul
                </button>

                <button onclick="setTheme('verde')">
                    🟢 Verde
                </button>

                <button onclick="setTheme('roxo')">
                    🟣 Roxo
                </button>

                <button onclick="setTheme('vermelho')">
                    🔴 Vermelho
                </button>

            </div>

        </div>

    </div>


    <!-- =====================
         PÁGINAS
    ====================== -->

    <div
        class="pages"
        id="pages"
    ></div>

</div>


<script>

/* ==================================================
   IPC ELECTRON
================================================== */

const { ipcRenderer } = require("electron");


/* ==================================================
   VARIÁVEIS
================================================== */

let tabs = [];
let activeTab = null;
let tabCounter = 0;


/* ==================================================
   CRIAR ABA
================================================== */

function createTab(title = "Nova aba", url = "") {

    tabCounter++;

    const id = "tab-" + tabCounter;

    const tab = {

        id,

        title,

        url,

        history: [],

        historyIndex: -1

    };

    tabs.push(tab);

    activeTab = id;

    renderTabs();
    renderPages();

    updateAddress();

    if (url) {

        loadUrl(url, true);

    }

}


/* ==================================================
   OBTER ABA ATIVA
================================================== */

function getActiveTab() {

    return tabs.find(
        tab => tab.id === activeTab
    );

}


/* ==================================================
   ABAS
================================================== */

function renderTabs() {

    const tabsElement =
        document.getElementById("tabs");

    tabsElement.innerHTML = "";

    tabs.forEach(tab => {

        const div =
            document.createElement("div");

        div.className =
            "tab " +
            (tab.id === activeTab
                ? "active"
                : "");

        div.innerHTML = `
            <span>🌐</span>
            <span class="tab-title">
                ${escapeHtml(tab.title)}
            </span>
            <span
                class="close-tab"
                onclick="closeTab(event,'${tab.id}')"
            >
                ×
            </span>
        `;

        div.onclick = function(event) {

            if (
                !event.target.classList.contains(
                    "close-tab"
                )
            ) {

                activateTab(tab.id);

            }

        };

        tabsElement.appendChild(div);

    });


    const plus =
        document.createElement("div");

    plus.className = "new-tab";

    plus.textContent = "+";

    plus.title = "Nova aba";

    plus.onclick = () => createTab();

    tabsElement.appendChild(plus);

}


/* ==================================================
   PÁGINAS
================================================== */

function renderPages() {

    const pages =
        document.getElementById("pages");

    pages.innerHTML = "";

    tabs.forEach(tab => {

        const page =
            document.createElement("div");

        page.className =
            "page " +
            (tab.id === activeTab
                ? "active"
                : "");

        page.id =
            "page-" + tab.id;

        page.innerHTML = createHomeHTML(tab.id);

        pages.appendChild(page);

    });

}


/* ==================================================
   HOME HTML
================================================== */

function createHomeHTML(id) {

    return `

        <div class="home">

            <h1>🌐 IternetWorld</h1>

            <p>
                Pesquise na Internet com o DuckDuckGo
            </p>

            <div class="search-box">

                <input
                    id="search-${id}"
                    type="text"
                    placeholder="Pesquisar na Internet..."
                    onkeydown="searchKey(event)"
                >

                <button
                    onclick="searchFromHome()"
                >
                    🔍
                </button>

            </div>


            <div class="shortcuts">

                <div
                    class="shortcut"
                    onclick="searchText('YouTube')"
                >
                    ▶️<br>
                    YouTube
                </div>

                <div
                    class="shortcut"
                    onclick="searchText('Minecraft')"
                >
                    ⛏️<br>
                    Minecraft
                </div>

                <div
                    class="shortcut"
                    onclick="searchText('Google')"
                >
                    🔎<br>
                    Google
                </div>

                <div
                    class="shortcut"
                    onclick="searchText('Notícias')"
                >
                    📰<br>
                    Notícias
                </div>

            </div>


            <a
                class="download-app"
                href="https://github.com/JogosWorld/InternetWorld/releases/download/v1.0.0/IternetWorld%20Setup%201.0.0.exe"
                target="_blank"
                rel="noopener"
            >
                ⬇️ Download IternetWorld para Windows
            </a>

            <div class="download-info">
                Versão 1.0.0 · Windows
            </div>

        </div>

    `;

}


/* ==================================================
   ATIVAR ABA
================================================== */

function activateTab(id) {

    activeTab = id;

    renderTabs();

    renderPages();

    updateAddress();

    const tab = getActiveTab();

    if (tab && tab.url) {

        showCurrentTab();

    }

    setTimeout(() => {

        const input =
            document.getElementById(
                "search-" + id
            );

        if (input) {

            input.focus();

        }

    }, 50);

}


/* ==================================================
   FECHAR ABA
================================================== */

function closeTab(event, id) {

    event.stopPropagation();

    const index =
        tabs.findIndex(
            tab => tab.id === id
        );

    tabs =
        tabs.filter(
            tab => tab.id !== id
        );

    if (tabs.length === 0) {

        createTab();

        return;

    }

    if (activeTab === id) {

        const newIndex =
            Math.max(
                0,
                index - 1
            );

        activeTab =
            tabs[newIndex].id;

    }

    renderTabs();
    renderPages();

    updateAddress();

}


/* ==================================================
   PESQUISA
================================================== */

function searchKey(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        searchText(
            event.target.value
        );

    }

}


function searchFromHome() {

    const input =
        document.getElementById(
            "search-" + activeTab
        );

    if (input) {

        searchText(input.value);

    }

}


async function searchText(text) {

    text = String(text).trim();

    if (!text) return;


    const tab =
        getActiveTab();

    if (!tab) return;


    tab.title =
        "DuckDuckGo: " + text;

    tab.url =
        "https://duckduckgo.com/?q=" +
        encodeURIComponent(text);

    tab.history =
        tab.history.slice(
            0,
            tab.historyIndex + 1
        );

    tab.history.push(tab.url);

    tab.historyIndex++;


    renderTabs();

    updateAddress();


    await showDuckResults(text);

}


/* ==================================================
   MOSTRAR RESULTADOS DUCKDUCKGO
================================================== */

async function showDuckResults(text) {

    const tab =
        getActiveTab();

    if (!tab) return;


    const page =
        document.getElementById(
            "page-" + tab.id
        );

    if (!page) return;


    page.innerHTML = `

        <div class="search-page">

            <div class="search-header">

                <div class="search-bar">

                    <input
                        id="result-search"
                        value="${escapeAttribute(text)}"
                        onkeydown="resultSearchKey(event)"
                    >

                    <button
                        onclick="searchResultPage()"
                    >
                        🔍
                    </button>

                </div>

            </div>


            <div
                class="results-container"
                id="results-container"
            >

                <div class="loading">
                    🔎 A pesquisar no DuckDuckGo...
                </div>

            </div>

        </div>
    `;


    try {

        const resposta =
            await ipcRenderer.invoke(
                "pesquisar-internet",
                text
            );


        console.log(
            "Resposta do main.js:",
            resposta
        );


        if (
            resposta &&
            resposta.sucesso &&
            Array.isArray(resposta.resultados) &&
            resposta.resultados.length > 0
        ) {

            renderResults(
                resposta.resultados
            );

        } else {

            /*
              Se o parser do main.js não
              encontrar resultados, usamos
              o próprio DuckDuckGo dentro
              da aba.
            */

            showDuckWebview(text);

        }

    } catch (erro) {

        console.error(
            "Erro IPC:",
            erro
        );

        showDuckWebview(text);

    }

}


/* ==================================================
   RESULTADOS
================================================== */

function renderResults(resultados) {

    const container =
        document.getElementById(
            "results-container"
        );

    if (!container) return;


    container.innerHTML = `

        <div class="results-info">
            🦆 Resultados pesquisados pelo
            <strong>DuckDuckGo</strong>
        </div>

    `;


    resultados.forEach(resultado => {

        const div =
            document.createElement("div");

        div.className = "result";


        const titulo =
            escapeHtml(
                resultado.titulo ||
                "Resultado"
            );

        const url =
            escapeAttribute(
                resultado.url || ""
            );

        const descricao =
            escapeHtml(
                resultado.descricao ||
                "Sem descrição disponível."
            );


        div.innerHTML = `

            <h2>

                <a
                    href="#"
                    onclick="openResult(event, '${url}')"
                >
                    ${titulo}
                </a>

            </h2>

            <div class="result-url">
                ${escapeHtml(
                    resultado.url || ""
                )}
            </div>

            <div class="result-description">
                ${descricao}
            </div>

        `;


        container.appendChild(div);

    });

}


/* ==================================================
   ABRIR RESULTADO DENTRO DA ABA
================================================== */

function openResult(event, url) {

    event.preventDefault();

    if (!url) return;

    const tab =
        getActiveTab();

    if (!tab) return;


    tab.url = url;

    tab.title =
        getTitleFromUrl(url);


    tab.history =
        tab.history.slice(
            0,
            tab.historyIndex + 1
        );

    tab.history.push(url);

    tab.historyIndex++;


    renderTabs();

    updateAddress();


    showWebview(url);

}


/* ==================================================
   WEBVIEW
================================================== */

function showWebview(url) {

    const tab =
        getActiveTab();

    if (!tab) return;


    const page =
        document.getElementById(
            "page-" + tab.id
        );

    if (!page) return;


    page.innerHTML = `

        <div class="webview-container">

            <webview
                id="webview-${tab.id}"
                src="${escapeAttribute(url)}"
                allowpopups
                partition="persist:internetworld"
            ></webview>

        </div>

    `;


    const webview =
        document.getElementById(
            "webview-" + tab.id
        );


    if (webview) {

        webview.addEventListener(
            "did-navigate",
            () => {

                try {

                    const atual =
                        webview.getURL();

                    if (atual) {

                        tab.url = atual;

                        document
                            .getElementById(
                                "address"
                            )
                            .value = atual;

                    }

                } catch(e) {}

            }
        );

    }

}


/* ==================================================
   FALLBACK DUCKDUCKGO
================================================== */

function showDuckWebview(text) {

    const url =
        "https://html.duckduckgo.com/html/?q=" +
        encodeURIComponent(text);

    const tab =
        getActiveTab();

    if (!tab) return;


    tab.url =
        "https://duckduckgo.com/?q=" +
        encodeURIComponent(text);


    tab.title =
        "DuckDuckGo: " + text;


    renderTabs();

    updateAddress();


    showWebview(url);

}


/* ==================================================
   PESQUISA DENTRO DOS RESULTADOS
================================================== */

function resultSearchKey(event) {

    if (event.key === "Enter") {

        searchResultPage();

    }

}


function searchResultPage() {

    const input =
        document.getElementById(
            "result-search"
        );

    if (input) {

        searchText(
            input.value
        );

    }

}


/* ==================================================
   ENDEREÇO
================================================== */

function addressKey(event) {

    if (event.key === "Enter") {

        goAddress();

    }

}


function goAddress() {

    const input =
        document.getElementById(
            "address"
        );

    let value =
        input.value.trim();

    if (!value) return;


    /*
       URL completa
    */

    if (
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {

        const tab =
            getActiveTab();

        tab.url = value;

        tab.title =
            getTitleFromUrl(value);

        tab.history =
            tab.history.slice(
                0,
                tab.historyIndex + 1
            );

        tab.history.push(value);

        tab.historyIndex++;


        renderTabs();

        showWebview(value);

        return;

    }


    /*
       YouTube
    */

    if (
        value.toLowerCase() ===
        "youtube"
        ||
        value.toLowerCase() ===
        "youtube.com"
    ) {

        goAddressUrl(
            "https://www.youtube.com/"
        );

        return;

    }


    /*
       Caso contrário pesquisa
    */

    searchText(value);

}


/* ==================================================
   ABRIR URL
================================================== */

function goAddressUrl(url) {

    const tab =
        getActiveTab();

    if (!tab) return;


    tab.url = url;

    tab.title =
        getTitleFromUrl(url);


    tab.history =
        tab.history.slice(
            0,
            tab.historyIndex + 1
        );

    tab.history.push(url);

    tab.historyIndex++;


    renderTabs();

    updateAddress();

    showWebview(url);

}


/* ==================================================
   LOAD URL
================================================== */

function loadUrl(url, addHistory = true) {

    const tab =
        getActiveTab();

    if (!tab) return;


    tab.url = url;

    tab.title =
        getTitleFromUrl(url);


    if (addHistory) {

        tab.history =
            tab.history.slice(
                0,
                tab.historyIndex + 1
            );

        tab.history.push(url);

        tab.historyIndex++;

    }


    renderTabs();

    updateAddress();


    if (
        url.includes(
            "duckduckgo.com"
        )
    ) {

        const pesquisa =
            getSearchFromUrl(url);

        if (pesquisa) {

            showDuckResults(
                pesquisa
            );

            return;

        }

    }


    showWebview(url);

}


/* ==================================================
   MOSTRAR ABA ATUAL
================================================== */

function showCurrentTab() {

    const tab =
        getActiveTab();

    if (!tab) return;


    if (
        tab.url &&
        tab.url.includes(
            "duckduckgo.com"
        )
    ) {

        const pesquisa =
            getSearchFromUrl(
                tab.url
            );

        if (pesquisa) {

            showDuckResults(
                pesquisa
            );

            return;

        }

    }


    if (tab.url) {

        showWebview(
            tab.url
        );

    } else {

        renderPages();

    }

}


/* ==================================================
   EXTRAIR PESQUISA DO URL
================================================== */

function getSearchFromUrl(url) {

    try {

        const u =
            new URL(url);

        return (
            u.searchParams.get("q") ||
            ""
        );

    } catch {

        return "";

    }

}


/* ==================================================
   HOME
================================================== */

function goHome() {

    const tab =
        getActiveTab();

    if (!tab) return;


    tab.url = "";

    tab.title =
        "Nova aba";


    renderTabs();

    renderPages();

    updateAddress();

}


/* ==================================================
   VOLTAR
================================================== */

function goBack() {

    const tab =
        getActiveTab();

    if (
        !tab ||
        tab.historyIndex <= 0
    ) return;


    tab.historyIndex--;

    const url =
        tab.history[
            tab.historyIndex
        ];


    tab.url = url;

    tab.title =
        getTitleFromUrl(url);


    renderTabs();

    updateAddress();

    showCurrentTab();

}


/* ==================================================
   AVANÇAR
================================================== */

function goForward() {

    const tab =
        getActiveTab();

    if (
        !tab ||
        tab.historyIndex >=
        tab.history.length - 1
    ) return;


    tab.historyIndex++;

    const url =
        tab.history[
            tab.historyIndex
        ];


    tab.url = url;

    tab.title =
        getTitleFromUrl(url);


    renderTabs();

    updateAddress();

    showCurrentTab();

}


/* ==================================================
   ATUALIZAR
================================================== */

function reloadPage() {

    const tab =
        getActiveTab();

    if (!tab) return;


    if (
        tab.url &&
        tab.url.includes(
            "duckduckgo.com"
        )
    ) {

        const pesquisa =
            getSearchFromUrl(
                tab.url
            );

        if (pesquisa) {

            showDuckResults(
                pesquisa
            );

            return;

        }

    }


    if (tab.url) {

        showWebview(
            tab.url
        );

    }

}


/* ==================================================
   ATUALIZAR BARRA
================================================== */

function updateAddress() {

    const input =
        document.getElementById(
            "address"
        );

    const tab =
        getActiveTab();

    if (!input) return;

    input.value =
        tab && tab.url
            ? tab.url
            : "IternetWorld://";

}


/* ==================================================
   PERSONALIZAÇÃO
================================================== */

function toggleCustomization() {

    document
        .getElementById(
            "customMenu"
        )
        .classList.toggle(
            "show"
        );

}


function setTheme(theme) {

    document.body.classList.remove(
        "claro",
        "verde",
        "roxo",
        "vermelho"
    );


    if (theme === "claro") {

        document.body.classList.add(
            "claro"
        );

    }


    if (theme === "verde") {

        document.body.classList.add(
            "verde"
        );

    }


    if (theme === "roxo") {

        document.body.classList.add(
            "roxo"
        );

    }


    if (theme === "vermelho") {

        document.body.classList.add(
            "vermelho"
        );

    }


    localStorage.setItem(
        "IternetWorldTheme",
        theme
    );

}


/* ==================================================
   FECHAR MENU
================================================== */

document.addEventListener(
    "click",
    function(event) {

        const box =
            document.querySelector(
                ".custom-box"
            );

        if (
            box &&
            !box.contains(
                event.target
            )
        ) {

            document
                .getElementById(
                    "customMenu"
                )
                .classList.remove(
                    "show"
                );

        }

    }
);


/* ==================================================
   CTRL + L
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "l"
        ) {

            event.preventDefault();

            const address =
                document.getElementById(
                    "address"
                );

            address.focus();

            address.select();

        }

    }
);


/* ==================================================
   SEGURANÇA
================================================== */

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(text) {

    return escapeHtml(text);

}


/* ==================================================
   TÍTULO
================================================== */

function getTitleFromUrl(url) {

    try {

        const u =
            new URL(url);

        if (
            u.hostname.includes(
                "duckduckgo"
            )
        ) {

            return "DuckDuckGo";

        }


        if (
            u.hostname.includes(
                "youtube"
            )
        ) {

            return "YouTube";

        }


        return u.hostname.replace(
            "www.",
            ""
        );

    } catch {

        return "Nova aba";

    }

}


/* ==================================================
   TEMA GUARDADO
================================================== */

const savedTheme =
    localStorage.getItem(
        "IternetWorldTheme"
    );


if (savedTheme) {

    setTheme(
        savedTheme
    );

}


/* ==================================================
   INICIAR
================================================== */

createTab(
    "Nova aba"
);

</script>
