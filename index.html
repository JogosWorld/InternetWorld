<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IternetWorld</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
}

body{
    background:#151515;
    color:white;
    overflow:hidden;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* ABAS */

#tabs{
    height:42px;
    background:#101010;
    display:flex;
    align-items:flex-end;
    padding-left:6px;
    overflow-x:auto;
}

.tab{
    height:36px;
    min-width:150px;
    max-width:230px;
    background:#292929;
    color:#ddd;
    border-radius:9px 9px 0 0;
    margin-right:4px;
    display:flex;
    align-items:center;
    padding:0 10px;
    cursor:pointer;
}

.tab.active{
    background:#1e1e1e;
    color:white;
}

.tab-title{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.close{
    background:none;
    border:0;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.newtab{
    width:42px;
    height:35px;
    background:none;
    border:0;
    color:white;
    font-size:25px;
    cursor:pointer;
}

/* BARRA */

#toolbar{
    height:58px;
    background:#1e1e1e;
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px;
}

.logo{
    color:#00bfff;
    font-weight:bold;
    font-size:18px;
    white-space:nowrap;
}

.toolbarButton{
    width:38px;
    height:38px;
    border:0;
    border-radius:8px;
    background:#303030;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.toolbarButton:hover{
    background:#404040;
}

#address{
    flex:1;
    height:38px;
    border:1px solid #444;
    border-radius:20px;
    background:#111;
    color:white;
    padding:0 16px;
    outline:none;
}

#go{
    height:38px;
    border:0;
    border-radius:20px;
    background:#00aeea;
    color:white;
    padding:0 18px;
    font-weight:bold;
    cursor:pointer;
}

#loginButton{
    height:38px;
    border:0;
    border-radius:20px;
    background:#00aeea;
    color:white;
    padding:0 14px;
    cursor:pointer;
}

/* PÁGINAS */

#pages{
    flex:1;
    position:relative;
    min-height:0;
}

.page{
    width:100%;
    height:100%;
    background:white;
    color:#222;
    overflow:auto;
}

/* INÍCIO */

.home{
    width:100%;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.home h1{
    font-size:52px;
    margin:0 0 10px;
}

.home h1 span{
    color:#00aeea;
}

.home p{
    font-size:18px;
}

.search{
    width:min(700px,90%);
    display:flex;
    gap:8px;
    margin-top:15px;
}

.search input{
    flex:1;
    height:48px;
    border:1px solid #bbb;
    border-radius:25px;
    padding:0 20px;
    font-size:16px;
    outline:none;
}

.search button{
    border:0;
    border-radius:25px;
    padding:0 25px;
    background:#00aeea;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.shortcuts{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.shortcut{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    background:#eee;
    cursor:pointer;
}

.download{
    margin-top:30px;
    padding:12px 20px;
    background:#222;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.version{
    margin-top:10px;
    color:#777;
    font-size:13px;
}

/* RESULTADOS */

.results{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.result{
    padding:18px;
    margin:12px 0;
    background:#f4f4f4;
    border:1px solid #ddd;
    border-radius:10px;
    cursor:pointer;
}

.result:hover{
    background:#e8e8e8;
}

.resultTitle{
    color:#1670b8;
    font-size:19px;
    font-weight:bold;
}

.resultUrl{
    color:#198754;
    font-size:13px;
    margin:5px 0;
}

/* WEBVIEW */

.webview{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.webviewTop{
    height:36px;
    background:#eee;
    border-bottom:1px solid #ccc;
    padding:9px 12px;
    font-size:13px;
}

.webview iframe{
    flex:1;
    width:100%;
    border:0;
}

/* PERSONALIZAÇÃO */

#themes{
    display:none;
    position:absolute;
    right:10px;
    top:105px;
    z-index:100;
    background:#222;
    border:1px solid #555;
    border-radius:10px;
    padding:10px;
}

#themes.show{
    display:block;
}

#themes button{
    display:block;
    width:140px;
    padding:9px;
    margin:5px;
    border:0;
    border-radius:7px;
    cursor:pointer;
}

/* LOGIN */

#login{
    display:none;
    position:fixed;
    inset:0;
    background:#000b;
    z-index:9999;
    align-items:center;
    justify-content:center;
}

#login.show{
    display:flex;
}

.loginBox{
    width:360px;
    max-width:90%;
    background:white;
    color:#222;
    border-radius:15px;
    padding:25px;
}

.loginBox h2{
    text-align:center;
    margin-top:0;
}

.loginBox input{
    width:100%;
    height:44px;
    margin:6px 0;
    padding:0 12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.loginBox button{
    width:100%;
    height:43px;
    margin-top:8px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

.loginMain{
    background:#00aeea;
    color:white;
}

.loginClose{
    background:#eee;
}

#loginMessage{
    color:#d00;
    text-align:center;
    min-height:20px;
    font-size:13px;
}

/* TEMAS */

body.light{
    background:#eee;
    color:#111;
}

body.light #tabs{
    background:#ddd;
}

body.light #toolbar{
    background:white;
}

body.light .toolbarButton{
    background:#ddd;
    color:#111;
}

body.light #address{
    background:#f4f4f4;
    color:#111;
}

body.green #go,
body.green #loginButton{
    background:#00b86b;
}

body.purple #go,
body.purple #loginButton{
    background:#8b45ff;
}

body.red #go,
body.red #loginButton{
    background:#e53935;
}

@media(max-width:700px){

    .logo{
        display:none;
    }

    #toolbar{
        gap:4px;
    }

    .toolbarButton{
        width:34px;
    }

    #loginButton{
        padding:0 9px;
    }

    .home h1{
        font-size:38px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="tabs"></div>

    <div id="toolbar">

        <div class="logo">🌐 IternetWorld</div>

        <button class="toolbarButton" onclick="back()">←</button>
        <button class="toolbarButton" onclick="forward()">→</button>
        <button class="toolbarButton" onclick="home()">⌂</button>
        <button class="toolbarButton" onclick="reload()">↻</button>

        <input
            id="address"
            placeholder="Pesquisar ou escrever um endereço"
            onkeydown="if(event.key==='Enter') navigate()"
        >

        <button id="go" onclick="navigate()">Ir</button>

        <button
            class="toolbarButton"
            onclick="toggleThemes()"
            title="Personalizar"
        >
            🎨
        </button>

        <button id="loginButton" onclick="openLogin()">
            👤
        </button>

    </div>

    <div id="pages"></div>

    <div id="themes">

        <button onclick="theme('')">🌙 Escuro</button>
        <button onclick="theme('light')">☀️ Claro</button>
        <button onclick="theme('green')">🟢 Verde</button>
        <button onclick="theme('purple')">🟣 Roxo</button>
        <button onclick="theme('red')">🔴 Vermelho</button>

    </div>

</div>


<!-- LOGIN OPCIONAL -->

<div id="login">

    <div class="loginBox">

        <h2>👤 Iniciar sessão</h2>

        <input id="email" type="email" placeholder="Email">

        <input id="password" type="password" placeholder="Palavra-passe">

        <div id="loginMessage"></div>

        <button class="loginMain" onclick="login()">
            Iniciar sessão
        </button>

        <button onclick="register()">
            Criar conta
        </button>

        <button class="loginClose" onclick="closeLogin()">
            Fechar
        </button>

    </div>

</div>


<script>

/* =========================
   ESTADO
========================= */

let tabs=[];
let activeTab=0;
let nextId=1;


/* =========================
   ABAS
========================= */

function newTab(){

    const tab={
        id:nextId++,
        title:"Nova aba",
        url:"",
        history:[],
        position:-1
    };

    tabs.push(tab);

    activeTab=tab.id;

    drawTabs();
    drawPage();

    home();
}


function current(){

    return tabs.find(t=>t.id===activeTab);

}


function drawTabs(){

    const area=document.getElementById("tabs");

    area.innerHTML="";

    tabs.forEach(tab=>{

        const div=document.createElement("div");

        div.className="tab";

        if(tab.id===activeTab)
            div.classList.add("active");

        div.onclick=function(){

            activeTab=tab.id;

            drawTabs();
            drawPage();

            const t=current();

            if(t.url){

                if(t.url.startsWith("search:"))
                    showSearch(t.url.substring(7));
                else
                    showWeb(t.url);

            }else{

                home();

            }

        };

        div.innerHTML=`
            <span class="tab-title">${safe(tab.title)}</span>
            <button class="close"
                onclick="event.stopPropagation();closeTab(${tab.id})">
                ×
            </button>
        `;

        area.appendChild(div);

    });

    const plus=document.createElement("button");

    plus.className="newtab";
    plus.textContent="+";
    plus.onclick=newTab;

    area.appendChild(plus);
}


function closeTab(id){

    const index=tabs.findIndex(t=>t.id===id);

    if(index<0)return;

    tabs.splice(index,1);

    if(tabs.length===0){

        newTab();
        return;

    }

    if(activeTab===id){

        activeTab=tabs[Math.max(0,index-1)].id;

    }

    drawTabs();
    drawPage();

    const t=current();

    if(t.url){

        if(t.url.startsWith("search:"))
            showSearch(t.url.substring(7));
        else
            showWeb(t.url);

    }else{

        home();

    }

}


function drawPage(){

    document.getElementById("pages").innerHTML=`
        <div class="page" id="page"></div>
    `;

}


/* =========================
   INÍCIO
========================= */

function home(){

    const t=current();

    t.url="";
    t.title="Nova aba";

    document.getElementById("address").value="";

    drawTabs();

    const page=document.getElementById("page");

    page.innerHTML=`

        <div class="home">

            <h1>🌐 <span>IternetWorld</span></h1>

            <p>Pesquise na Internet com o DuckDuckGo</p>

            <div class="search">

                <input
                    id="homeSearch"
                    placeholder="Pesquisar na Internet..."
                    onkeydown="if(event.key==='Enter') searchHome()"
                >

                <button onclick="searchHome()">
                    Pesquisar
                </button>

            </div>

            <div class="shortcuts">

                <button
                    class="shortcut"
                    onclick="openUrl('https://www.youtube.com/')">
                    ▶️ YouTube
                </button>

                <button
                    class="shortcut"
                    onclick="openUrl('https://www.google.com/')">
                    🔎 Google
                </button>

                <button
                    class="shortcut"
                    onclick="openUrl('https://www.minecraft.net/')">
                    ⛏️ Minecraft
                </button>

                <button
                    class="shortcut"
                    onclick="searchText('notícias')">
                    📰 Notícias
                </button>

            </div>

            <a
                class="download"
                href="https://github.com/JogosWorld/InternetWorld/releases/download/v1.0.0/IternetWorld.Setup.1.0.0.exe"
                target="_blank">
                ⬇️ Download IternetWorld para Windows
            </a>

            <div class="version">
                Versão 1.0.0 · Windows
            </div>

        </div>
    `;

}


/* =========================
   PESQUISA
========================= */

function searchHome(){

    const value=document.getElementById("homeSearch").value;

    searchText(value);

}


function searchText(text){

    text=text.trim();

    if(!text)return;

    const t=current();

    t.url="search:"+text;
    t.title=text;

    t.history=t.history.slice(0,t.position+1);
    t.history.push(t.url);
    t.position++;

    drawTabs();
    showSearch(text);

}


function showSearch(text){

    document.getElementById("address").value=text;

    const page=document.getElementById("page");

    page.innerHTML=`

        <div class="results">

            <h2>🔎 Resultados para: ${safe(text)}</h2>

            <div class="result"
                 onclick="openUrl('https://www.youtube.com/')">

                <div class="resultTitle">
                    YouTube
                </div>

                <div class="resultUrl">
                    youtube.com
                </div>

                Vídeos, música e entretenimento.

            </div>


            <div class="result"
                 onclick="openUrl('https://www.google.com/search?q=${encodeURIComponent(text)}')">

                <div class="resultTitle">
                    Google
                </div>

                <div class="resultUrl">
                    google.com
                </div>

                Pesquisar na Internet.

            </div>


            <div class="result"
                 onclick="openUrl('https://pt.wikipedia.org/wiki/${encodeURIComponent(text)}')">

                <div class="resultTitle">
                    Wikipedia
                </div>

                <div class="resultUrl">
                    pt.wikipedia.org
                </div>

                Enciclopédia livre.

            </div>


            <div class="result"
                 onclick="openUrl('https://github.com/search?q=${encodeURIComponent(text)}')">

                <div class="resultTitle">
                    GitHub
                </div>

                <div class="resultUrl">
                    github.com
                </div>

                Projetos e código.

            </div>


            <br>

            <button
                id="go"
                onclick="openUrl('https://duckduckgo.com/?q=${encodeURIComponent(text)}')">

                Mais resultados

            </button>

        </div>
    `;

}


/* =========================
   ENDEREÇO
========================= */

function navigate(){

    const input=document.getElementById("address");

    let value=input.value.trim();

    if(!value)return;

    if(/^https?:\/\//i.test(value)){

        openUrl(value);
        return;

    }

    if(/^[a-z0-9.-]+\.[a-z]{2,}$/i.test(value)){

        openUrl("https://"+value);
        return;

    }

    searchText(value);

}


function openUrl(url){

    const t=current();

    t.url=url;
    t.title=getTitle(url);

    t.history=t.history.slice(0,t.position+1);
    t.history.push(url);
    t.position++;

    drawTabs();
    showWeb(url);

}


function showWeb(url){

    document.getElementById("address").value=url;

    const page=document.getElementById("page");

    page.innerHTML=`

        <div class="webview">

            <div class="webviewTop">
                🌐 ${safe(getTitle(url))}
            </div>

            <iframe
                src="${attr(url)}"
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen>
            </iframe>

        </div>
    `;

}


/* =========================
   VOLTAR / AVANÇAR
========================= */

function back(){

    const t=current();

    if(t.position<=0)return;

    t.position--;

    const url=t.history[t.position];

    t.url=url;

    if(url.startsWith("search:")){

        showSearch(url.substring(7));

    }else{

        showWeb(url);

    }

}


function forward(){

    const t=current();

    if(t.position>=t.history.length-1)return;

    t.position++;

    const url=t.history[t.position];

    t.url=url;

    if(url.startsWith("search:")){

        showSearch(url.substring(7));

    }else{

        showWeb(url);

    }

}


function reload(){

    const t=current();

    if(!t.url){

        home();

        return;

    }

    if(t.url.startsWith("search:")){

        showSearch(t.url.substring(7));

    }else{

        showWeb(t.url);

    }

}


/* =========================
   TEMAS
========================= */

function toggleThemes(){

    document
        .getElementById("themes")
        .classList.toggle("show");

}


function theme(name){

    document.body.className=name;

    localStorage.setItem(
        "IternetWorldTheme",
        name
    );

    document
        .getElementById("themes")
        .classList.remove("show");

}


const savedTheme=
    localStorage.getItem("IternetWorldTheme");

if(savedTheme){

    document.body.className=savedTheme;

}


/* =========================
   LOGIN OPCIONAL
========================= */

function openLogin(){

    document.getElementById("login").classList.add("show");

    document.getElementById("loginMessage").textContent="";

}


function closeLogin(){

    document.getElementById("login").classList.remove("show");

}


function getUsers(){

    try{

        return JSON.parse(
            localStorage.getItem("IternetWorldUsers") || "[]"
        );

    }catch(e){

        return [];

    }

}


function saveUsers(users){

    localStorage.setItem(
        "IternetWorldUsers",
        JSON.stringify(users)
    );

}


function login(){

    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;

    const message=document.getElementById("loginMessage");

    if(!email || !password){

        message.textContent=
            "Preenche o email e a palavra-passe.";

        return;

    }

    const users=getUsers();

    const user=users.find(
        u=>u.email===email && u.password===password
    );

    if(!user){

        message.textContent=
            "Conta não encontrada. Podes criar uma conta.";

        return;

    }

    localStorage.setItem(
        "IternetWorldCurrentUser",
        email
    );

    message.style.color="green";
    message.textContent="Sessão iniciada!";

    setTimeout(closeLogin,700);

}


function register(){

    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;

    const message=document.getElementById("loginMessage");

    if(!email || !password){

        message.textContent=
            "Preenche o email e a palavra-passe.";

        return;

    }

    const users=getUsers();

    if(users.some(u=>u.email===email)){

        message.textContent=
            "Esta conta já existe.";

        return;

    }

    users.push({
        email:email,
        password:password
    });

    saveUsers(users);

    localStorage.setItem(
        "IternetWorldCurrentUser",
        email
    );

    message.style.color="green";
    message.textContent=
        "Conta criada com sucesso!";

    setTimeout(closeLogin,700);

}


/* =========================
   SEGURANÇA
========================= */

function safe(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function attr(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


function getTitle(url){

    try{

        return new URL(url)
            .hostname
            .replace(/^www\./,"");

    }catch(e){

        return "IternetWorld";

    }

}


/* =========================
   ATALHOS
========================= */

document.addEventListener("keydown",function(e){

    if(
        (e.ctrlKey || e.metaKey) &&
        e.key.toLowerCase()==="l"
    ){

        e.preventDefault();

        document.getElementById("address").focus();

        document.getElementById("address").select();

    }

});


/* =========================
   INICIAR
========================= */

newTab();

</script>

</body>
</html>
