
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IternetWorld</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#07101f;
  --bar:#0d1728;
  --card:#111f35;
  --card2:#162742;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:#263853;
  --accent:#2563eb;
}

body.light{
  --bg:#eef3f9;
  --bar:#fff;
  --card:#fff;
  --card2:#f4f7fb;
  --text:#172033;
  --muted:#64748b;
  --line:#d5deea;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

button,input{font:inherit}
button{cursor:pointer}

#app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ABAS */

#tabs{
  height:52px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 8px;
  background:var(--bar);
  border-bottom:1px solid var(--line);
  overflow-x:auto;
}

.tab{
  height:39px;
  min-width:145px;
  max-width:240px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 8px 0 14px;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  color:var(--muted);
  transition:.2s;
}

.tab:hover{
  background:var(--card2);
  color:var(--text);
}

.tab.active{
  color:var(--text);
  background:linear-gradient(135deg,var(--card2),var(--card));
  border-color:var(--line);
  box-shadow:0 0 20px rgba(37,99,235,.18);
}

.tab-title{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:left;
}

.tab-close{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:18px;
  border-radius:7px;
}

.tab-close:hover{
  background:rgba(127,127,127,.2);
  color:var(--text);
}

.newtab{
  flex:0 0 auto;
  width:40px;
  height:39px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  font-size:22px;
}

/* BARRA */

#toolbar{
  height:60px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:var(--bar);
  border-bottom:1px solid var(--line);
}

.logo-mini{
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
  margin-right:4px;
}

.logo-mini span{
  color:var(--accent);
}

.tool{
  width:37px;
  height:37px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
}

.tool:hover{
  border-color:var(--accent);
}

#addressForm{
  flex:1;
  min-width:100px;
  display:flex;
  gap:7px;
}

#addressInput{
  width:100%;
  height:39px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:0;
  background:var(--card);
  color:var(--text);
}

#addressInput:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(37,99,235,.13);
}

.goBtn{
  height:39px;
  padding:0 18px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:#fff;
  font-weight:800;
}

.loginBtn{
  height:37px;
  padding:0 13px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  font-weight:700;
}

.loginBtn:hover{
  border-color:var(--accent);
}

/* PÁGINA */

#page{
  flex:1;
  overflow:auto;
  background:var(--bg);
}

.home{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 18px;
}

.brand{
  font-size:clamp(44px,7vw,78px);
  font-weight:900;
  letter-spacing:-4px;
  margin-bottom:8px;
  text-shadow:0 0 35px rgba(37,99,235,.22);
}

.brand span{
  color:var(--accent);
}

.subtitle{
  color:var(--muted);
  margin-bottom:28px;
}

.searchBox{
  width:min(760px,95%);
  display:flex;
  gap:9px;
}

.searchBox input{
  flex:1;
  height:55px;
  padding:0 18px;
  border:1px solid var(--line);
  border-radius:16px;
  outline:0;
  background:var(--card);
  color:var(--text);
}

.searchBox input:focus{
  border-color:var(--accent);
}

.searchBox button{
  height:55px;
  padding:0 25px;
  border:0;
  border-radius:16px;
  background:var(--accent);
  color:#fff;
  font-weight:800;
}

.shortcuts{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  max-width:850px;
  margin-top:24px;
}

.shortcut{
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px 15px;
  background:var(--card);
  color:var(--text);
  text-decoration:none;
}

.shortcut:hover{
  border-color:var(--accent);
  transform:translateY(-2px);
}

.info{
  margin-top:25px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

/* RESULTADOS */

.results{
  max-width:1000px;
  margin:auto;
  padding:30px 20px;
}

.resultsHead{
  margin-bottom:20px;
}

.resultsHead h2{
  margin:0 0 6px;
}

.result{
  padding:18px;
  margin-bottom:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--card);
  cursor:pointer;
}

.result:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}

.resultTitle{
  color:#60a5fa;
  font-size:18px;
  font-weight:700;
}

.resultUrl{
  color:#22c55e;
  font-size:13px;
  margin:6px 0;
  word-break:break-all;
}

.resultDesc{
  color:var(--muted);
  line-height:1.5;
}

.loading{
  padding:40px;
  text-align:center;
  color:var(--muted);
}

/* SITES */

.sitePage{
  height:100%;
  display:flex;
  flex-direction:column;
}

.siteBar{
  min-height:43px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 15px;
  background:var(--card);
  border-bottom:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
}

.siteDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
}

.siteFrame{
  width:100%;
  flex:1;
  border:0;
  background:#fff;
}

/* MENU */

#menu{
  position:fixed;
  right:12px;
  top:114px;
  width:290px;
  z-index:20;
  display:none;
  padding:10px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.menuTitle{
  padding:10px 12px;
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
}

.menuItem{
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  display:flex;
  justify-content:space-between;
  background:transparent;
  color:var(--text);
  text-align:left;
}

.menuItem:hover{
  background:var(--card2);
}

/* MODAL */

#overlay{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.65);
}

.modal{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--card);
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.modal h2{
  margin:0 0 8px;
}

.modal p{
  color:var(--muted);
}

.modal input{
  width:100%;
  height:43px;
  margin:7px 0;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:0;
  background:var(--bg);
  color:var(--text);
}

.modalActions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.primary{
  flex:1;
  height:43px;
  border:0;
  border-radius:10px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
}

.secondary{
  min-height:40px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card2);
  color:var(--text);
}

.list{
  max-height:420px;
  overflow:auto;
  margin-top:12px;
}

.listRow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border-bottom:1px solid var(--line);
}

.listRow div{
  flex:1;
  min-width:0;
}

.small{
  color:var(--muted);
  font-size:12px;
}

.empty{
  padding:25px;
  color:var(--muted);
  text-align:center;
}

.colors{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.colorBtn{
  width:44px;
  height:44px;
  border:3px solid var(--line);
  border-radius:50%;
}

@media(max-width:700px){
  .logo-mini,
  .loginBtn{
    display:none;
  }

  #toolbar{
    padding:7px;
  }

  .tool{
    width:34px;
  }

  .goBtn{
    padding:0 12px;
  }

  .tab{
    min-width:125px;
  }

  .brand{
    letter-spacing:-2px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="tabs"></div>

  <div id="toolbar">

    <div class="logo-mini">
      Iternet<span>World</span>
    </div>

    <button class="tool" title="Voltar" onclick="goBack()">←</button>
    <button class="tool" title="Avançar" onclick="goForward()">→</button>
    <button class="tool" title="Recarregar" onclick="reloadPage()">↻</button>
    <button class="tool" title="Página inicial" onclick="goHome()">⌂</button>

    <form id="addressForm" onsubmit="navigate(event)">
      <input
        id="addressInput"
        autocomplete="off"
        placeholder="Pesquisar ou escrever um endereço">
      <button class="goBtn">Ir</button>
    </form>

    <button class="tool" title="Favorito" onclick="addFavorite()">★</button>

    <button
      class="loginBtn"
      id="loginButton"
      onclick="openLogin()">
      Entrar
    </button>

    <button
      class="tool"
      title="Menu"
      onclick="toggleMenu()">
      ☰
    </button>

  </div>

  <main id="page"></main>

</div>

<div id="menu">

  <div class="menuTitle">IternetWorld</div>

  <button class="menuItem" onclick="showFavorites()">
    ⭐ Favoritos <span>›</span>
  </button>

  <button class="menuItem" onclick="showHistory()">
    🕘 Histórico <span>›</span>
  </button>

  <button class="menuItem" onclick="showDownloads()">
    ⬇ Downloads <span>›</span>
  </button>

  <button class="menuItem" onclick="openAI()">
    🤖 IternetWorld AI <span>›</span>
  </button>

  <button class="menuItem" onclick="showSettings()">
    🎨 Personalização <span>›</span>
  </button>

  <button class="menuItem" onclick="toggleTheme()">
    🌙 Modo claro/escuro <span>›</span>
  </button>

</div>

<div id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>

/* =====================================================
   ELECTRON
===================================================== */

let electronAPI=null;

try{
  if(window.require){
    const {ipcRenderer}=window.require("electron");

    electronAPI={
      pesquisar: texto =>
        ipcRenderer.invoke(
          "pesquisar-internet",
          texto
        )
    };
  }
}catch(e){
  electronAPI=null;
}


/* =====================================================
   DADOS
===================================================== */

const USERS_KEY="IternetWorldUsers";
const CURRENT_KEY="IternetWorldCurrentUser";
const FAV_KEY="iw_favorites";
const HIST_KEY="iw_history";
const THEME_KEY="iw_theme";
const ACCENT_KEY="iw_accent";

let tabs=[];
let active=0;

let history=JSON.parse(
  localStorage.getItem(HIST_KEY)||"[]"
);

let favorites=JSON.parse(
  localStorage.getItem(FAV_KEY)||"[]"
);

let accent=
  localStorage.getItem(ACCENT_KEY)||
  "#2563eb";

document.documentElement.style.setProperty(
  "--accent",
  accent
);

const knownSites=[
  ["YouTube","https://www.youtube.com/"],
  ["Google","https://www.google.com/"],
  ["GitHub","https://github.com/"],
  ["Facebook","https://www.facebook.com/"],
  ["Instagram","https://www.instagram.com/"],
  ["TikTok","https://www.tiktok.com/"],
  ["Wikipedia","https://pt.wikipedia.org/"],
  ["Twitch","https://www.twitch.tv/"]
];


/* =====================================================
   UTILIDADES
===================================================== */

function esc(s){
  return String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}

function save(){

  localStorage.setItem(
    HIST_KEY,
    JSON.stringify(history.slice(0,300))
  );

  localStorage.setItem(
    FAV_KEY,
    JSON.stringify(favorites)
  );
}

function current(){
  return tabs[active];
}


/* =====================================================
   ABAS
===================================================== */

function createTab(url=""){

  tabs.push({
    title:"Nova aba",
    url:url,
    back:[],
    forward:[]
  });

  active=tabs.length-1;

  renderTabs();

  if(url){
    showTab();
  }else{
    goHome();
  }
}

function renderTabs(){

  const el=document.getElementById("tabs");

  el.innerHTML="";

  tabs.forEach((t,i)=>{

    const d=document.createElement("div");

    d.className=
      "tab"+
      (i===active?" active":"");

    d.onclick=()=>{

      active=i;

      showTab();

      renderTabs();

    };

    const title=document.createElement("span");

    title.className="tab-title";

    title.textContent=
      t.title||"Nova aba";

    const x=document.createElement("button");

    x.className="tab-close";
    x.textContent="×";

    x.onclick=e=>{

      e.stopPropagation();

      closeTab(i);

    };

    d.append(title,x);

    el.appendChild(d);

  });

  const plus=document.createElement("button");

  plus.className="newtab";
  plus.textContent="+";

  plus.onclick=()=>createTab();

  el.appendChild(plus);
}

function closeTab(i){

  tabs.splice(i,1);

  if(!tabs.length){

    createTab();

    return;
  }

  if(active>=tabs.length){
    active=tabs.length-1;
  }

  showTab();
  renderTabs();
}

function showTab(){

  if(!current()){
    createTab();
    return;
  }

  const t=current();

  if((t.url||"").startsWith("search:")){

    pesquisar(t.url.slice(7));

  }else if(t.url){

    renderSite(t.url,false);

  }else{

    goHome();

  }
}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function isURL(v){

  return /^https?:\/\//i.test(v) ||
    /^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v);

}

function makeURL(v){

  return /^https?:\/\//i.test(v)
    ?v
    :"https://"+v;
}

function navigate(e){

  e.preventDefault();

  const v=
    document.getElementById(
      "addressInput"
    ).value.trim();

  if(!v)return;

  if(isURL(v)){

    openSiteNewTab(
      makeURL(v)
    );

  }else{

    searchNewTab(v);

  }
}


/* =====================================================
   HOME
===================================================== */

function goHome(){

  if(!current())return;

  current().title="Nova aba";
  current().url="";

  document.getElementById(
    "addressInput"
  ).value="";

  renderTabs();

  document.getElementById("page").innerHTML=`

    <section class="home">

      <div class="brand">
        Iternet<span>World</span>
      </div>

      <div class="subtitle">
        Pesquisa e navegação num só lugar.
      </div>

      <form
        class="searchBox"
        onsubmit="homeSearch(event)">

        <input
          id="homeInput"
          autocomplete="off"
          placeholder="Pesquisar com DuckDuckGo...">

        <button>
          Pesquisar
        </button>

      </form>

      <div class="shortcuts">

        ${knownSites.map(
          ([n,u])=>`
            <button
              class="shortcut"
              onclick="openSiteNewTab('${u}')">
              ${n}
            </button>
          `
        ).join("")}

        <button
          class="shortcut"
          onclick="openAI()">
          🤖 IternetWorld AI
        </button>

        <a
          class="shortcut"
          href="https://github.com/JogosWorld/InternetWorld/releases/download/v1.0.0/IternetWorld.Setup.1.0.0.exe">
          ⬇ Download IternetWorld
        </a>

      </div>

      <div class="info">
        Abas · DuckDuckGo · favoritos · histórico ·
        personalização · AI · downloads
      </div>

    </section>

  `;
}

function homeSearch(e){

  e.preventDefault();

  const q=
    document.getElementById(
      "homeInput"
    ).value.trim();

  if(q){
    searchNewTab(q);
  }
}


/* =====================================================
   PESQUISA
===================================================== */

function searchNewTab(q){

  q=q.trim();

  if(!q)return;

  tabs.push({
    title:q,
    url:"search:"+q,
    back:[],
    forward:[]
  });

  active=tabs.length-1;

  renderTabs();

  pesquisar(q);
}

async function pesquisar(q){

  const t=current();

  if(!t)return;

  t.title=q;

  document.getElementById(
    "addressInput"
  ).value=q;

  renderTabs();

  document.getElementById("page").innerHTML=`

    <div class="results">

      <div class="loading">
        🔎 A pesquisar no DuckDuckGo...
      </div>

    </div>

  `;

  /*
     Electron:
     usamos o main.js para consultar
     DuckDuckGo sem iframe.
  */

  if(electronAPI){

    try{

      const resposta=
        await electronAPI.pesquisar(q);

      if(resposta.sucesso){

        renderResults(
          q,
          resposta.resultados
        );

      }else{

        renderSearchError(
          resposta.erro
        );

      }

      return;

    }catch(e){

      console.error(e);

    }
  }

  /*
     Navegador normal:
     mostramos uma alternativa
     porque alguns navegadores
     bloqueiam o DuckDuckGo em iframe.
  */

  renderBrowserSearch(q);
}

function renderResults(q,resultados){

  if(!resultados.length){

    renderSearchError(
      "O DuckDuckGo não devolveu resultados."
    );

    return;
  }

  document.getElementById("page").innerHTML=`

    <div class="results">

      <div class="resultsHead">

        <h2>
          Resultados DuckDuckGo
        </h2>

        <div class="small">
          Pesquisa: ${esc(q)}
        </div>

      </div>

      ${resultados.map((r,i)=>`

        <div
          class="result"
          onclick="openSearchResult(${i})">

          <div class="resultTitle">
            ${esc(r.titulo)}
          </div>

          <div class="resultUrl">
            ${esc(r.url)}
          </div>

          <div class="resultDesc">
            ${esc(r.descricao)}
          </div>

        </div>

      `).join("")}

    </div>

  `;

  window.currentSearchResults=resultados;
}

function openSearchResult(i){

  const r=
    window.currentSearchResults &&
    window.currentSearchResults[i];

  if(!r)return;

  openSiteNewTab(r.url);
}

function renderSearchError(msg){

  document.getElementById("page").innerHTML=`

    <div class="results">

      <div class="result">

        <h2>Não foi possível pesquisar</h2>

        <p class="resultDesc">
          ${esc(msg)}
        </p>

        <button
          class="goBtn"
          onclick="window.open('https://duckduckgo.com/?q=${encodeURIComponent(current().title)}','_blank')">
          Abrir DuckDuckGo
        </button>

      </div>

    </div>

  `;
}

function renderBrowserSearch(q){

  document.getElementById("page").innerHTML=`

    <div class="results">

      <div class="result">

        <h2>DuckDuckGo</h2>

        <p class="resultDesc">
          Para pesquisar no DuckDuckGo,
          carrega no botão abaixo.
        </p>

        <button
          class="goBtn"
          onclick="openSiteNewTab(
            'https://html.duckduckgo.com/html/?q=${encodeURIComponent(q)}'
          )">
          Pesquisar no DuckDuckGo
        </button>

      </div>

    </div>

  `;
}


/* =====================================================
   SITES
===================================================== */

function openSiteNewTab(url){

  tabs.push({
    title:"A carregar…",
    url:url,
    back:[],
    forward:[]
  });

  active=tabs.length-1;

  renderTabs();

  renderSite(url,true);
}

function renderSite(url,record=true){

  let title=url;

  try{

    title=
      new URL(url)
        .hostname
        .replace(/^www\./,"");

  }catch(e){}

  current().title=title;

  document.getElementById(
    "addressInput"
  ).value=url;

  renderTabs();

  if(record){

    history.unshift({
      title:title,
      url:url,
      time:new Date()
        .toLocaleString("pt-PT")
    });

    history=history.slice(0,300);

    save();
  }

  document.getElementById("page").innerHTML=`

    <div class="sitePage">

      <div class="siteBar">

        <span class="siteDot"></span>

        <strong>
          ${esc(title)}
        </strong>

        <span>•</span>

        <span>
          ${esc(url)}
        </span>

      </div>

      <iframe
        class="siteFrame"
        src="${esc(url)}"
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture">
      </iframe>

    </div>

  `;
}

function goBack(){

  const t=current();

  if(!t || !t.back.length)return;

  t.forward.unshift(t.url);
  t.url=t.back.shift();

  showTab();
}

function goForward(){

  const t=current();

  if(!t || !t.forward.length)return;

  t.back.unshift(t.url);
  t.url=t.forward.shift();

  showTab();
}

function reloadPage(){
  showTab();
}

function addFavorite(){

  const t=current();

  if(!t || !t.url)return;

  if(t.url.startsWith("search:"))return;

  if(!favorites.some(x=>x.url===t.url)){

    favorites.unshift({
      title:t.title,
      url:t.url
    });

    save();

    alert("Adicionado aos favoritos.");

  }else{

    alert("Já está nos favoritos.");

  }
}

/* =====================================================
   LOGIN
===================================================== */

function getUsers(){

  return JSON.parse(
    localStorage.getItem(
      USERS_KEY
    )||"[]"
  );
}

function openLogin(){

  const u=
    localStorage.getItem(
      CURRENT_KEY
    );

  if(u){

    openModal(
      "👤 Conta",
      `

        <p>
          Estás ligado como
          <strong>${esc(u)}</strong>.
        </p>

        <button
          class="primary"
          onclick="logout()">
          Terminar sessão
        </button>

      `
    );

    return;
  }

  openModal(
    "🔐 Entrar no IternetWorld",
    `

      <input
        id="loginUser"
        placeholder="Nome de utilizador">

      <input
        id="loginPass"
        type="password"
        placeholder="Palavra-passe">

      <div class="modalActions">

        <button
          class="primary"
          onclick="login()">
          Entrar
        </button>

        <button
          class="secondary"
          onclick="register()">
          Criar conta
        </button>

      </div>

      <p class="small">
        O login é opcional.
      </p>

    `
  );
}

function register(){

  const u=
    document.getElementById(
      "loginUser"
    ).value.trim();

  const p=
    document.getElementById(
      "loginPass"
    ).value;

  if(!u||!p){

    alert(
      "Preenche o utilizador e a palavra-passe."
    );

    return;
  }

  const users=getUsers();

  if(
    users.some(
      x=>
        x.user.toLowerCase()===
        u.toLowerCase()
    )
  ){

    alert(
      "Esse utilizador já existe."
    );

    return;
  }

  users.push({
    user:u,
    pass:p
  });

  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(users)
  );

  localStorage.setItem(
    CURRENT_KEY,
    u
  );

  updateLoginButton();

  closeModal();

  alert("Conta criada.");
}

function login(){

  const u=
    document.getElementById(
      "loginUser"
    ).value.trim();

  const p=
    document.getElementById(
      "loginPass"
    ).value;

  const user=
    getUsers().find(
      x=>
        x.user===u &&
        x.pass===p
    );

  if(!user){

    alert(
      "Utilizador ou palavra-passe incorretos."
    );

    return;
  }

  localStorage.setItem(
    CURRENT_KEY,
    u
  );

  updateLoginButton();

  closeModal();
}

function logout(){

  localStorage.removeItem(
    CURRENT_KEY
  );

  updateLoginButton();

  closeModal();
}

function updateLoginButton(){

  const u=
    localStorage.getItem(
      CURRENT_KEY
    );

  document.getElementById(
    "loginButton"
  ).textContent=
    u
      ?"👤 "+u
      :"Entrar";
}
